<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Applied before first paint, deliberately inline and deliberately
			// blocking. Reading the preference from a module would leave one frame
			// of light theme on every load for anyone who chose dark, which is the
			// flash every dark-mode implementation is judged by.
			try {
				const saved = localStorage.getItem('cairn.theme');
				const dark =
					saved === 'dark' ||
					(saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				// Private mode, or storage disabled. The OS preference still applies
				// through the media query in app.css; only the override is lost.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
