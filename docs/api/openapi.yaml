        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/TagId"
    get:
      tags: [Tags]
      operationId: getTag
      summary: Retrieve a tag
      x-cairn-phase: 1
      x-cairn-scopes: [tags:read]
      responses:
