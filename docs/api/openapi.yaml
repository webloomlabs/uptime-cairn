        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Reports]
      operationId: updateReportSchedule
      summary: Update a report schedule
      x-cairn-phase: 2
      x-cairn-scopes: [reports:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportScheduleWrite" }
