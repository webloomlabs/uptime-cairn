    get:
      tags: [Reports]
      operationId: downloadReportArtifact
      summary: Download a generated report
      x-cairn-phase: 2
      x-cairn-scopes: [reports:read]
      parameters:
        - name: format
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ReportFormat" }
      responses:
        "200":
          description: The rendered report.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/html:
              schema: { type: string }
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:

  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: cairn_<key>
      description: |
        A scoped API key: `Authorization: Bearer cairn_<key>`. Keys carry an explicit
        scope list, an optional expiry, and a last-used timestamp, and can be revoked
        at any time. Every operation names the scopes it requires in `x-cairn-scopes`.
    SessionCookie:
      type: apiKey
      in: cookie
      name: cairn_session
      description: |
        The browser session established by `POST /api/v1/auth/login`. The cookie is
        `HttpOnly`, `SameSite=Lax`, and `Secure` when served over HTTPS.
        State-changing requests authenticated this way must also carry a matching
        `X-Cairn-CSRF-Token` header.

  parameters:
    CollectionLimit:
      name: limit
      in: query
      description: |
        Maximum items to return. The server caps this; requesting more is clamped,
        not rejected.
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    Search:
      name: q
      in: query
      description: Free-text search across the resource's human-readable fields.
      schema: { type: string, maxLength: 200 }
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from a previous response's `pagination.next_cursor`. Cursors are
        not decodable, not sortable, and not guaranteed stable across releases.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Maximum items to return for cursor-paginated collections.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    From:
      name: from
      in: query
      description: Start of the time range, inclusive. RFC 3339. Defaults to 24 hours before `to`.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: End of the time range, exclusive. RFC 3339. Defaults to now.
      schema: { type: string, format: date-time }
    MonitorId:
      name: monitorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MaintenanceWindowId:
      name: maintenanceWindowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusPageId:
      name: statusPageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusPageSlug:
      name: slug
      in: path
      required: true
      description: The status page's URL slug.
      schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$" }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportTemplateId:
      name: reportTemplateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportRunId:
      name: reportRunId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request was malformed — unparseable parameters, an invalid range, a bad cursor.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No credentials were supplied, or they were not valid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        The caller is authenticated but lacks the required scope or role. The problem
        document names the missing scope, so an operator can fix the key rather than guess.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with the current state — a duplicate slug, a referenced resource still in use.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The upload exceeded the configured limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: |
        The request was well-formed but semantically invalid. `errors` names each
        offending field by JSON pointer.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:

    # ------------------------------------------------------------------------
    # Errors, pagination, and shared primitives
    # ------------------------------------------------------------------------

    Problem:
      type: object
      description: An error, per RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            A stable URI identifying the error kind. Clients branch on this, never on
            `title` or `detail`, both of which are prose and may be translated.
          examples: ["https://uptimecairn.dev/errors/monitor-not-found"]
        title:
          type: string
          description: A short, human-readable summary of the error kind.
        status:
          type: integer
          description: The HTTP status code, repeated for clients that only read the body.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path that produced the error.
        request_id:
          type: string
          description: Correlates this response with the server log entry.

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              description: One entry per invalid field.
              items:
                type: object
                required: [pointer, code, message]
                properties:
                  pointer:
                    type: string
                    description: RFC 6901 JSON pointer to the offending field.
                    examples: ["/config/interval_seconds"]
                  code:
                    type: string
                    description: Stable machine-readable reason.
                    examples: ["below_minimum"]
                  message:
                    type: string
                    description: Human-readable explanation.

    CursorPagination:
      type: object
      description: |
        The only pagination model in this API, per ADR-004: every list view is a
        cursor-paginated query keyed on `(updated_at, id)`, applied uniformly
        regardless of how few rows an install has. Iterate until `next_cursor` is null.

        There is deliberately **no total count**. Computing one costs a full scan of
        the filtered set on every page fetch, which is the cost cursor pagination
        exists to avoid. A count for the current filter comes from
        `GET /api/v1/monitors/membership` instead, which returns it alongside the
        change signal the client is already polling.
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. Null when the collection is exhausted.
        has_more: { type: boolean }

    BulkResult:
      type: object
      description: The outcome of a bulk operation, reported per identifier.
      required: [succeeded, failed]
      properties:
        succeeded:
          type: array
          items: { type: string, format: uuid }
        failed:
          type: array
          items:
            type: object
            required: [id, code, message]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              message: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks:
          type: array
          description: Individual subsystem checks. Present on readiness, omitted on liveness.
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                examples: ["database", "migrations", "scheduler"]
              status: { type: string, enum: [ok, degraded, unavailable] }
              detail: { type: string }

    SystemInfo:
      type: object
      required: [version, mode]
      properties:
        version:
          type: string
          description: Semantic version of the running build.
          examples: ["0.1.0"]
        commit: { type: string }
        built_at: { type: string, format: date-time }
        mode:
          type: string
          enum: [solo, control_plane, probe]
          description: |
            Deployment shape. Solo is the single binary with an embedded probe and
            SQLite; the others are the scaled-mode split from ADR-001.
        storage_engine: { type: string, enum: [sqlite, postgres_timescale] }
        api_version: { type: string, examples: ["v1"] }
        monitor_types:
          type: array
          description: Monitor types this build supports, so clients need not hardcode the list.
          items: { $ref: "#/components/schemas/MonitorType" }
        notification_channel_types:
          type: array
          items: { $ref: "#/components/schemas/NotificationChannelType" }
        capabilities:
          type: object
          description: |
            Feature flags reflecting what this build and configuration can do — the
            mechanism progressive disclosure runs on. The dashboard hides surfaces the
            instance does not have rather than showing dead controls.
          additionalProperties: { type: boolean }

    Overview:
      type: object
      description: Aggregate dashboard counts.
      required: [monitors, generated_at]
      properties:
        monitors:
          type: object
          required: [total, up, down, pending, paused, maintenance]
          properties:
            total: { type: integer }
            up: { type: integer }
            down: { type: integer }
            pending: { type: integer }
            paused: { type: integer }
            maintenance: { type: integer }
        active_incidents: { type: integer }
        active_maintenance_windows: { type: integer }
        certificates_expiring_soon:
          type: integer
          description: Monitors whose observed certificate falls inside its configured threshold.
        domains_expiring_soon: { type: integer }
        generated_at: { type: string, format: date-time }

    # ------------------------------------------------------------------------
    # Setup, sessions, and API keys
    # ------------------------------------------------------------------------

    SetupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 200 }
        password:
          type: string
          minLength: 12
          writeOnly: true
          description: Hashed with argon2id. Minimum length is enforced server-side and may be raised by settings.
        instance_name: { type: string, maxLength: 200 }
        timezone:
          type: string
          description: IANA timezone name used for schedules, reports, and display.
          examples: ["Australia/Sydney"]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
          description: Required when the account has TOTP enabled.
        recovery_code:
          type: string
          writeOnly: true
          description: A single-use recovery code, accepted in place of `totp_code`.

    Session:
      type: object
      description: The authenticated principal.
      required: [principal_type]
      properties:
        principal_type: { type: string, enum: [user, api_key] }
        user: { $ref: "#/components/schemas/User" }
        api_key_id: { type: [string, "null"], format: uuid }
        scopes:
          type: array
          description: Effective scopes. A user session holds the scopes its role grants.
          items: { $ref: "#/components/schemas/ApiKeyScope" }
        csrf_token:
          type: [string, "null"]
          description: Present for cookie sessions; echo it in `X-Cairn-CSRF-Token` on writes.
        expires_at: { type: [string, "null"], format: date-time }

    TotpEnrolment:
      type: object
      required: [secret, provisioning_uri]
      properties:
        secret:
          type: string
          description: Base32 shared secret. Shown once, during enrolment.
        provisioning_uri:
          type: string
          description: otpauth:// URI for QR rendering.

    TotpDisableRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, writeOnly: true }
        totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
        recovery_code: { type: string, writeOnly: true }

    ApiKeyScope:
      type: string
      description: |
        A permission grant. Scopes are `<resource>:<read|write>`; `write` implies `read`
        on the same resource. Clients must tolerate scopes added in later releases.
      enum:
        - monitors:read
        - monitors:write
        - heartbeats:read
        - groups:read
        - groups:write
        - tags:read
        - tags:write
        - notifications:read
        - notifications:write
        - maintenance:read
        - maintenance:write
        - incidents:read
        - incidents:write
        - status_pages:read
        - status_pages:write
        - webhooks:read
        - webhooks:write
        - imports:write
        - settings:read
        - settings:write
        - users:read
        - users:write
        - api_keys:read
        - api_keys:write
        - metrics:read
        - teams:read
        - teams:write
        - schedules:read
        - schedules:write
        - reports:read
        - reports:write

    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        prefix:
          type: string
          description: The key's non-secret leading characters, so a key can be identified in a list.
          examples: ["cairn_7Kq2"]
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ApiKeyScope" }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Null until first use. The signal for finding keys safe to revoke.
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }

    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 200 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiKeyScope" }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null means no expiry.

    ApiKeyUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiKeyScope" }
        expires_at: { type: [string, "null"], format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                The plaintext key. Returned in this response only — the server stores a
                hash and cannot show it again.
              examples: ["cairn_7Kq2xM4vPn8sTbYw1eR6uJ3aZfLd0gHc"]

    # ------------------------------------------------------------------------
    # Monitors
    #
    # A monitor is `MonitorCommon` plus a `type` discriminator and a `config`
    # object whose shape that type determines. Server-managed fields are marked
    # readOnly and are always present on reads; the `required` lists describe
    # what a client must send when writing.
    # ------------------------------------------------------------------------

    MonitorType:
      type: string
      description: |
        The check a monitor performs. Immutable after creation — changing it would make
        the monitor's own history incomparable with itself.
      enum: [http, tcp, icmp, dns, tls_expiry, domain_expiry, push, docker, grpc]

    MonitorStatus:
      type: string
      description: |
        `pending` covers both a monitor that has never reported and one that is retrying
        below its failure threshold — it has not yet earned a verdict either way.
      enum: [up, down, pending, paused, maintenance]

    MonitorCommon:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description:
          type: [string, "null"]
          maxLength: 5000
          description: Free-text notes. Shown on monitor detail and available to templates.
        enabled:
          type: boolean
          default: true
          description: A disabled monitor is not scheduled and raises no alerts. Equivalent to paused.
        interval_seconds:
          type: integer
          minimum: 20
          maximum: 86400
          default: 60
          description: Seconds between checks. The 20-second floor is a product commitment.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
          description: Per-check timeout. Must be less than `interval_seconds`.
        retries:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: |
            Consecutive failures required before the monitor is declared down. Zero means
            the first failure counts. While retrying, status is `pending`, not `down`.
        retry_interval_seconds:
          type: [integer, "null"]
          minimum: 20
          maximum: 86400
          description: Interval used while retrying. Null uses `interval_seconds`.
        resend_after:
          type: integer
          minimum: 0
          default: 0
          description: |
            Re-notify after this many consecutive failed checks while still down.
            Zero disables resending, so an ongoing outage alerts once.
        upside_down:
          type: boolean
          default: false
          description: Invert the verdict — a failing check means up. For checks that should not succeed.
        group_id: { type: [string, "null"], format: uuid }
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        parent_monitor_id:
          type: [string, "null"]
          format: uuid
          description: |
            Dependency parent. While the parent is down, this monitor's alerts are
            suppressed and its heartbeats are annotated as suppressed — the router being
            down should page once, not forty times. Cycles are rejected.
        notification_channel_ids:
          type: array
          description: Channels alerted on state change. Empty means no alerts for this monitor.
          items: { type: string, format: uuid }
        notify_on_recovery:
          type: boolean
          default: true
          description: Whether recovery sends a notification as well as the failure.
        status:
          allOf:
            - $ref: "#/components/schemas/MonitorStatus"
          readOnly: true
        last_check_at: { type: [string, "null"], format: date-time, readOnly: true }
        next_check_at: { type: [string, "null"], format: date-time, readOnly: true }
        last_heartbeat:
          allOf:
            - $ref: "#/components/schemas/Heartbeat"
          readOnly: true
          description: Present when requested via `include=last_heartbeat`.
        uptime:
          allOf:
            - $ref: "#/components/schemas/UptimeSummary"
          readOnly: true
          description: Present when requested via `include=uptime`.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Monitor:
      description: A configured check. The `type` field selects the shape of `config`.
      oneOf:
        - $ref: "#/components/schemas/HttpMonitor"
        - $ref: "#/components/schemas/TcpMonitor"
        - $ref: "#/components/schemas/IcmpMonitor"
        - $ref: "#/components/schemas/DnsMonitor"
        - $ref: "#/components/schemas/TlsExpiryMonitor"
        - $ref: "#/components/schemas/DomainExpiryMonitor"
        - $ref: "#/components/schemas/PushMonitor"
        - $ref: "#/components/schemas/DockerMonitor"
        - $ref: "#/components/schemas/GrpcMonitor"
      discriminator:
        propertyName: type
        mapping:
          http: "#/components/schemas/HttpMonitor"
          tcp: "#/components/schemas/TcpMonitor"
          icmp: "#/components/schemas/IcmpMonitor"
          dns: "#/components/schemas/DnsMonitor"
          tls_expiry: "#/components/schemas/TlsExpiryMonitor"
          domain_expiry: "#/components/schemas/DomainExpiryMonitor"
          push: "#/components/schemas/PushMonitor"
          docker: "#/components/schemas/DockerMonitor"
          grpc: "#/components/schemas/GrpcMonitor"

    MonitorWrite:
      description: Request body for creating a monitor. Same shape as `Monitor`; readOnly fields are ignored.
      $ref: "#/components/schemas/Monitor"

    MonitorUpdate:
      description: |
        Partial update. Every field is optional; `type` may not be changed. `config` is
        merged shallowly against the monitor's existing configuration, so a caller can
        change one setting without restating the rest.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        enabled: { type: boolean }
        interval_seconds: { type: integer, minimum: 20, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        retries: { type: integer, minimum: 0, maximum: 20 }
        retry_interval_seconds: { type: [integer, "null"], minimum: 20, maximum: 86400 }
        resend_after: { type: integer, minimum: 0 }
        upside_down: { type: boolean }
        group_id: { type: [string, "null"], format: uuid }
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        parent_monitor_id: { type: [string, "null"], format: uuid }
        notification_channel_ids:
          type: array
          items: { type: string, format: uuid }
        notify_on_recovery: { type: boolean }
        config:
          description: Partial configuration, validated against the monitor's existing type.
          oneOf:
            - $ref: "#/components/schemas/HttpConfig"
            - $ref: "#/components/schemas/TcpConfig"
            - $ref: "#/components/schemas/IcmpConfig"
            - $ref: "#/components/schemas/DnsConfig"
            - $ref: "#/components/schemas/TlsExpiryConfig"
            - $ref: "#/components/schemas/DomainExpiryConfig"
            - $ref: "#/components/schemas/PushConfig"
            - $ref: "#/components/schemas/DockerConfig"
            - $ref: "#/components/schemas/GrpcConfig"

    MonitorBulkRequest:
      type: object
      required: [monitor_ids, operation]
      properties:
        monitor_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, format: uuid }
        operation:
          type: string
          enum: [enable, disable, delete, add_tags, remove_tags, set_group, set_notification_channels]
        tag_ids:
          type: array
          description: Required for `add_tags` and `remove_tags`.
          items: { type: string, format: uuid }
        group_id:
          type: [string, "null"]
          format: uuid
          description: Required for `set_group`. Null removes the monitors from their group.
        notification_channel_ids:
          type: array
          description: Required for `set_notification_channels`. Replaces the existing assignment.
          items: { type: string, format: uuid }

    HttpMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: http }
            config: { $ref: "#/components/schemas/HttpConfig" }

    TcpMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: tcp }
            config: { $ref: "#/components/schemas/TcpConfig" }

    IcmpMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: icmp }
            config: { $ref: "#/components/schemas/IcmpConfig" }

    DnsMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: dns }
            config: { $ref: "#/components/schemas/DnsConfig" }

    TlsExpiryMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: tls_expiry }
            config: { $ref: "#/components/schemas/TlsExpiryConfig" }

    DomainExpiryMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: domain_expiry }
            config: { $ref: "#/components/schemas/DomainExpiryConfig" }

    PushMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: push }
            config: { $ref: "#/components/schemas/PushConfig" }

    DockerMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: docker }
            config: { $ref: "#/components/schemas/DockerConfig" }

    GrpcMonitor:
      allOf:
        - $ref: "#/components/schemas/MonitorCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: grpc }
            config: { $ref: "#/components/schemas/GrpcConfig" }

    # --- Per-type configuration ---------------------------------------------

    HttpConfig:
      type: object
      description: |
        An HTTP/HTTPS check. Assertions are evaluated in order — status code, then
        keyword, then JSON path, then response time — and the first failure is what the
        heartbeat message reports, so an operator sees the actual cause rather than a
        generic failure.
      required: [url]
      properties:
        url: { type: string, format: uri }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          default: GET
        headers:
          type: object
          description: Request headers. Values are stored encrypted and redacted on read.
          additionalProperties: { type: string }
        body: { type: [string, "null"] }
        body_encoding:
          type: string
          enum: [json, form, text, xml]
          default: json
          description: Sets the default Content-Type when one is not given in `headers`.
        accepted_status_codes:
          type: array
          description: Status codes or inclusive ranges treated as success.
          default: ["200-299"]
          items: { type: string, pattern: "^[1-5][0-9]{2}(-[1-5][0-9]{2})?$" }
        keyword:
          type: [object, "null"]
          description: Assert on the response body.
          required: [value, mode]
          properties:
            value: { type: string, minLength: 1 }
            mode: { type: string, enum: [contains, not_contains, regex, not_regex] }
            case_sensitive: { type: boolean, default: false }
        json_path:
          type: [object, "null"]
          description: Assert on a value extracted from a JSON response body.
          required: [path, operator]
          properties:
            path:
              type: string
              description: JSONPath expression.
              examples: ["$.status"]
            operator: { type: string, enum: [eq, ne, contains, gt, gte, lt, lte, exists, not_exists] }
            expected: { type: [string, "null"], description: Compared as a string; omitted for existence operators. }
        response_time_threshold_ms:
          type: [integer, "null"]
          minimum: 1
          description: Fail the check if the response takes longer than this, even on a 200.
        follow_redirects: { type: boolean, default: true }
        max_redirects: { type: integer, minimum: 0, maximum: 20, default: 10 }
        verify_tls:
          type: boolean
          default: true
          description: Disabling this is offered for internal targets with private CAs, and is surfaced as a warning in the UI.
        auth:
          type: [object, "null"]
          description: Credentials are stored encrypted and redacted on read.
          required: [type]
          properties:
            type: { type: string, enum: [none, basic, bearer] }
            username: { type: [string, "null"] }
            password: { type: [string, "null"], writeOnly: true }
            token: { type: [string, "null"], writeOnly: true }
        ip_family:
          type: string
          enum: [auto, ipv4, ipv6]
          default: auto

    TcpConfig:
      type: object
      description: A TCP connect check. Success is a completed handshake within the timeout.
      required: [hostname, port]
      properties:
        hostname: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        ip_family: { type: string, enum: [auto, ipv4, ipv6], default: auto }

    IcmpConfig:
      type: object
      description: |
        An ICMP ping check.

        Raw sockets are unavailable in many container runtimes. When that is detected the
        monitor fails with an explicit, explanatory message rather than breaking silently,
        and — if `fallback_to_tcp` is set — automatically checks the named TCP port
        instead, recording on each heartbeat that it did so.
      required: [hostname]
      properties:
        hostname: { type: string, minLength: 1 }
        packet_size: { type: integer, minimum: 8, maximum: 65507, default: 56 }
        packet_count: { type: integer, minimum: 1, maximum: 10, default: 1 }
        fallback_to_tcp:
          type: boolean
          default: false
          description: Fall back to a TCP connect check when raw ICMP sockets are unavailable.
        fallback_tcp_port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
          description: Required when `fallback_to_tcp` is true.
        ip_family: { type: string, enum: [auto, ipv4, ipv6], default: auto }

    DnsConfig:
      type: object
      description: A DNS record check against a chosen resolver.
      required: [hostname, record_type]
      properties:
        hostname: { type: string, minLength: 1 }
        record_type:
          type: string
          enum: [A, AAAA, CNAME, MX, NS, TXT, SRV, CAA, SOA, PTR]
        resolver:
          type: [string, "null"]
          description: Resolver address. Null uses the system resolver.
          examples: ["1.1.1.1"]
        resolver_port: { type: integer, minimum: 1, maximum: 65535, default: 53 }
        expected_values:
          type: array
          description: Expected record values. Empty means the check asserts only that the record resolves.
          items: { type: string }
        match_mode:
          type: string
          enum: [any, all, exact]
          default: any
          description: |
            `any` passes if one expected value is present, `all` if every one is,
            `exact` if the answer set matches exactly with nothing extra.

    TlsExpiryConfig:
      type: object
      description: |
        A TLS certificate check. Fails when the certificate is within
        `days_remaining_threshold` of expiry, or when chain validation fails and
        `verify_chain` is set. Observed certificate detail is available from
        `/monitors/{id}/certificate`.
      required: [hostname]
      properties:
        hostname: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 443 }
        server_name:
          type: [string, "null"]
          description: SNI server name, when it differs from `hostname`.
        days_remaining_threshold: { type: integer, minimum: 0, maximum: 3650, default: 14 }
        verify_chain: { type: boolean, default: true }

    DomainExpiryConfig:
      type: object
      description: |
        A domain registration expiry check via RDAP, falling back to WHOIS where RDAP is
        unavailable. Checked no more often than once a day regardless of the monitor's
        interval, because registries rate-limit and the data changes yearly.
      required: [domain]
      properties:
        domain: { type: string, minLength: 1 }
        days_remaining_threshold: { type: integer, minimum: 0, maximum: 3650, default: 30 }
        source: { type: string, enum: [auto, rdap, whois], default: auto }

    PushConfig:
      type: object
      description: |
        A dead-man's switch. The monitor is up while something calls
        `/api/v1/push/{push_token}` at least once per `expected_interval_seconds`, and
        goes down once that interval plus `grace_period_seconds` elapses with no call.
      properties:
        push_token:
          type: string
          readOnly: true
          description: |
            Issued on creation. Treat as a secret — anyone holding it can report this
            monitor healthy. Rotate by recreating the monitor.
        push_url:
          type: string
          format: uri
          readOnly: true
          description: The full URL to call, assembled from the instance base URL.
        expected_interval_seconds:
          type: integer
          minimum: 20
          maximum: 2592000
          default: 60
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 30
          description: Slack allowed on top of the expected interval before declaring down.

    DockerConfig:
      type: object
      description: |
        A container check via the Docker API. Requires the daemon socket to be reachable
        from wherever the probe runs, which in solo mode means mounting it into the container.
      required: [container]
      properties:
        container:
          type: string
          description: Container name or ID.
        docker_host:
          type: string
          default: "unix:///var/run/docker.sock"
          description: Socket path or TCP endpoint of the Docker daemon.
        require_healthy:
          type: boolean
          default: false
          description: |
            When true, a running container with a failing healthcheck counts as down.
            When false, running is sufficient.
        tls:
          type: [object, "null"]
          description: Client TLS material for a remote daemon. Stored encrypted, redacted on read.
          properties:
            ca_cert: { type: [string, "null"], writeOnly: true }
            client_cert: { type: [string, "null"], writeOnly: true }
            client_key: { type: [string, "null"], writeOnly: true }
            verify: { type: boolean, default: true }

    GrpcConfig:
      type: object
      description: A gRPC health check, per the standard `grpc.health.v1.Health/Check` protocol.
      required: [address]
      properties:
        address:
          type: string
          description: Host and port of the gRPC server.
          examples: ["api.example.com:443"]
        service_name:
          type: [string, "null"]
          description: Service to query. Null checks overall server health.
        use_tls: { type: boolean, default: true }
        verify_tls: { type: boolean, default: true }
        accepted_statuses:
          type: array
          description: Health statuses treated as success.
          default: [SERVING]
          items: { type: string, enum: [SERVING, NOT_SERVING, UNKNOWN, SERVICE_UNKNOWN] }
        metadata:
          type: object
          description: Request metadata. Stored encrypted, redacted on read.
          additionalProperties: { type: string }

    # ------------------------------------------------------------------------
    # Heartbeats and history
    # ------------------------------------------------------------------------

    HeartbeatStatus:
      type: string
      description: |
        `unknown` and `skipped` are statements about the probe, not the target, and are
        excluded from every uptime ratio exactly as an absent bucket is: `unknown` means
        the probe could not perform the check, `skipped` that it never started because
        the probe shed it under load. Collapsing either into `down` would report a probe
        outage as a total customer outage — see
        [ADR-005](../adr/005-probe-architecture.md) decision 16.
      enum: [up, down, pending, maintenance, unknown, skipped]

    Heartbeat:
      type: object
      description: One check result.
      required: [monitor_id, time, status]
      properties:
        monitor_id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/HeartbeatStatus" }
        response_time_ms:
          type: [number, "null"]
          description: Null when the check did not complete far enough to time anything.
        message:
          type: [string, "null"]
          description: Human-readable outcome — the assertion that failed, or the transport error.
        code:
          type: [string, "null"]
          description: Protocol-level result, such as an HTTP status or a gRPC health status.
        attempt:
          type: integer
          minimum: 1
          description: Which retry produced this result. 1 for the first attempt.
        important:
          type: boolean
          description: |
            True when this heartbeat changed the monitor's state. The events, as opposed
            to the ticks — this is what `important_only` filters to and what drives alerts.
        suppressed:
          type: boolean
          default: false
          description: |
            True when notifications were withheld — a maintenance window was active, or a
            dependency parent was already down. The check still ran and still recorded a result.
        suppression_reason:
          type: [string, "null"]
          enum: [maintenance, dependency, null]
        probe_id:
          type: [string, "null"]
          description: |
            Which probe executed the check. Null in solo mode, where the probe is
            in-process and unnamed. Populated once multi-region probes ship in Phase 4.

    HistoryResolution:
      type: string
      description: |
        Rollup tier, per the tiered pipeline in ADR-002. `auto` lets the server choose the
        coarsest tier that still yields a useful number of buckets for the range.
      enum: [auto, raw, 1m, 5m, 1h, 1d]

    HistoryResponse:
      type: object
      required: [monitor_id, resolution, from, to, data]
      properties:
        monitor_id: { type: string, format: uuid }
        resolution:
          allOf:
            - $ref: "#/components/schemas/HistoryResolution"
          description: The tier actually used, which may be coarser than requested.
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        data:
          type: array
          items: { $ref: "#/components/schemas/HistoryBucket" }

    HistoryBucket:
      type: object
      required: [bucket_start, up_count, down_count]
      properties:
        bucket_start: { type: string, format: date-time }
        up_count: { type: integer, minimum: 0 }
        down_count: { type: integer, minimum: 0 }
        maintenance_count: { type: integer, minimum: 0 }
        pending_count: { type: integer, minimum: 0 }
        uptime_ratio:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Null for a bucket with no checks — a gap, which is not the same as downtime.
        response_time_avg_ms: { type: [number, "null"] }
        response_time_min_ms: { type: [number, "null"] }
        response_time_max_ms: { type: [number, "null"] }
        response_time_p95_ms: { type: [number, "null"] }

    UptimeSummary:
      type: object
      description: Uptime and latency statistics per named window.
      required: [windows]
      properties:
        maintenance_handling:
          type: string
          enum: [exclude, count_as_up, count_as_down]
          description: How maintenance time was treated. Reported so an SLA figure carries its own method.
        windows:
          type: object
          description: Keyed by window name — `24h`, `30d`, and so on.
          additionalProperties:
            type: object
            required: [uptime_ratio]
            properties:
              uptime_ratio: { type: [number, "null"], minimum: 0, maximum: 1 }
              total_checks: { type: integer, minimum: 0 }
              down_checks: { type: integer, minimum: 0 }
              downtime_seconds: { type: integer, minimum: 0 }
              maintenance_seconds: { type: integer, minimum: 0 }
              response_time_avg_ms: { type: [number, "null"] }
              response_time_p95_ms: { type: [number, "null"] }
              incident_count: { type: integer, minimum: 0 }

    CertificateInfo:
      type: object
      description: The TLS certificate observed on the most recent check.
      required: [valid_to, days_remaining]
      properties:
        subject: { type: string }
        issuer: { type: string }
        serial_number: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        days_remaining: { type: integer }
        fingerprint_sha256: { type: string }
        subject_alternative_names:
          type: array
          items: { type: string }
        chain_valid: { type: boolean }
        chain_error: { type: [string, "null"] }
        observed_at: { type: string, format: date-time }

    PushHeartbeat:
      type: object
      description: Optional body for a push heartbeat.
      properties:
        status: { type: string, enum: [up, down], default: up }
        message: { type: string, maxLength: 1024 }
        response_time_ms: { type: number, minimum: 0 }

    # ------------------------------------------------------------------------
    # Live updates (ADR-004)
    # ------------------------------------------------------------------------

    MembershipSignal:
      type: object
      description: |
        A cheap answer to "has this filtered view changed?" — returned by
        `GET /api/v1/monitors/membership`.

        `version` covers content: it changes when any monitor matching the filter
        changes status or configuration. `count` covers membership: it changes when a
        monitor enters or leaves the filter. Both are needed — a monitor leaving a
        `status=down` filter as another enters it keeps the count identical while the
        view is now wrong.

        Neither value is meaningful in isolation or comparable across different
        filters. Clients store the pair per view and compare it to the previous poll.
      required: [version, count, generated_at]
      properties:
        version:
          type: integer
          format: int64
          description: |
            Monotonic within a filter. Derived server-side; clients must treat it as
            opaque and only ever test it for inequality against their previous value.
        count:
          type: integer
          minimum: 0
          description: |
            Monitors currently matching the filter. This is where a list UI gets its
            result count, since cursor pagination deliberately carries no total.
        generated_at: { type: string, format: date-time }

    MonitorStatusDiff:
      type: object
      description: |
        The payload pushed to a client subscribed to a monitor currently on its screen.

        **Not returned by any REST endpoint.** It is documented here because it is part
        of the API contract and a client has to be written against it. ADR-004 puts it
        on a NATS subject shaped `updates.{org_id}.{monitor_id}.status` in scaled mode
        and an in-process bus in solo mode; both present this identical shape, so a
        frontend never knows which mode it is talking to.

        It is a diff, not a state blob: only what changed is sent, and only for
        monitors the client has explicitly subscribed to. A client renders a page of
        monitors, subscribes to exactly those IDs, and unsubscribes when they leave the
        viewport — which is what makes push volume bounded by viewport size rather than
        by total monitor count.
      required: [monitor_id, status, at]
      properties:
        monitor_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        previous_status: { $ref: "#/components/schemas/MonitorStatus" }
        at: { type: string, format: date-time }
        response_time_ms: { type: [number, "null"] }
        message: { type: [string, "null"] }
        suppressed: { type: boolean }
        heartbeat:
          allOf:
            - $ref: "#/components/schemas/Heartbeat"
          description: The heartbeat that caused the change, present on state transitions.

    OverviewDiff:
      type: object
      description: |
        The global "X up, Y down" summary, pushed on its own channel independently of
        per-monitor subscriptions.

        Deliberately **not** computed by having the client sum whatever it happens to be
        subscribed to — that would silently couple a global number to viewport state, so
        the header would disagree with itself as the user paginated. Server-computed,
        decoupled from monitor count and viewport size alike.
      required: [monitors, generated_at]
      properties:
        monitors:
          type: object
          required: [total, up, down, pending, paused, maintenance]
          properties:
            total: { type: integer }
            up: { type: integer }
            down: { type: integer }
            pending: { type: integer }
            paused: { type: integer }
            maintenance: { type: integer }
        active_incidents: { type: integer }
        active_maintenance_windows: { type: integer }
        generated_at: { type: string, format: date-time }

    # ------------------------------------------------------------------------
    # Groups and tags
    # ------------------------------------------------------------------------

    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        parent_group_id:
          type: [string, "null"]
          format: uuid
          description: Groups may nest one level deep in Phase 1. Cycles are rejected.
        monitor_count: { type: integer, minimum: 0, readOnly: true }
        status:
          allOf:
            - $ref: "#/components/schemas/MonitorStatus"
          readOnly: true
          description: Worst status among the group's monitors — down beats pending beats up.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    GroupWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        parent_group_id: { type: [string, "null"], format: uuid }

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 100 }
        slug:
          type: string
          readOnly: true
          description: URL-safe form derived from the name, unique across the instance.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          default: "#6b7280"
          description: Hex colour used in the UI and on status pages.
        description: { type: [string, "null"], maxLength: 2000 }
        monitor_count: { type: integer, minimum: 0, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    TagWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        description: { type: [string, "null"], maxLength: 2000 }

    # ------------------------------------------------------------------------
    # Notification channels
    # ------------------------------------------------------------------------

    NotificationChannelType:
      type: string
      description: |
        Native channels, plus `apprise` as a meta-provider covering roughly ninety more.
        Clients must tolerate values added in later releases.
      enum:
        - email
        - webhook
        - slack
        - discord
        - telegram
        - matrix
        - gotify
        - ntfy
        - msteams
        - pagerduty
        - opsgenie
        - twilio
        - apprise

    EventType:
      type: string
      description: Every state change the system emits, to webhooks and to notification channels alike.
      enum:
        - monitor.up
        - monitor.down
        - monitor.pending
        - monitor.created
        - monitor.updated
        - monitor.deleted
        - monitor.paused
        - monitor.resumed
        - monitor.certificate_expiring
        - monitor.domain_expiring
        - incident.opened
        - incident.updated
        - incident.resolved
        - maintenance.started
        - maintenance.ended
        - report.generated

    NotificationChannelCommon:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean, default: true }
        is_default:
          type: boolean
          default: false
          description: Default channels are attached to newly created monitors automatically.
        events:
          type: array
          description: Events this channel receives. Empty means all monitor state changes.
          items: { $ref: "#/components/schemas/EventType" }
        last_used_at: { type: [string, "null"], format: date-time, readOnly: true }
        last_error:
          type: [string, "null"]
          readOnly: true
          description: The most recent delivery failure, so a silently broken channel is visible.
        monitor_count: { type: integer, minimum: 0, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    NotificationChannel:
      description: An alert destination. `type` selects the shape of `config`.
      oneOf:
        - $ref: "#/components/schemas/EmailChannel"
        - $ref: "#/components/schemas/WebhookChannel"
        - $ref: "#/components/schemas/SlackChannel"
        - $ref: "#/components/schemas/DiscordChannel"
        - $ref: "#/components/schemas/TelegramChannel"
        - $ref: "#/components/schemas/MatrixChannel"
        - $ref: "#/components/schemas/GotifyChannel"
        - $ref: "#/components/schemas/NtfyChannel"
        - $ref: "#/components/schemas/MsTeamsChannel"
        - $ref: "#/components/schemas/PagerDutyChannel"
        - $ref: "#/components/schemas/OpsgenieChannel"
        - $ref: "#/components/schemas/TwilioChannel"
        - $ref: "#/components/schemas/AppriseChannel"
      discriminator:
        propertyName: type
        mapping:
          email: "#/components/schemas/EmailChannel"
          webhook: "#/components/schemas/WebhookChannel"
          slack: "#/components/schemas/SlackChannel"
          discord: "#/components/schemas/DiscordChannel"
          telegram: "#/components/schemas/TelegramChannel"
          matrix: "#/components/schemas/MatrixChannel"
          gotify: "#/components/schemas/GotifyChannel"
          ntfy: "#/components/schemas/NtfyChannel"
          msteams: "#/components/schemas/MsTeamsChannel"
          pagerduty: "#/components/schemas/PagerDutyChannel"
          opsgenie: "#/components/schemas/OpsgenieChannel"
          twilio: "#/components/schemas/TwilioChannel"
          apprise: "#/components/schemas/AppriseChannel"

    NotificationChannelWrite:
      description: Request body for creating a channel. Same shape as `NotificationChannel`.
      $ref: "#/components/schemas/NotificationChannel"

    NotificationChannelUpdate:
      type: object
      description: |
        Partial update. `type` may not change. Redacted secrets may be omitted to leave
        them as they are; supplying a value replaces the stored secret.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
        is_default: { type: boolean }
        events:
          type: array
          items: { $ref: "#/components/schemas/EventType" }
        config:
          type: object
          description: Partial configuration, validated against the channel's existing type.
          additionalProperties: true

    EmailChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: email }
            config:
              type: object
              required: [to]
              properties:
                to:
                  type: array
                  minItems: 1
                  items: { type: string, format: email }
                cc: { type: array, items: { type: string, format: email } }
                use_instance_smtp:
                  type: boolean
                  default: true
                  description: Use the instance-wide SMTP settings rather than the per-channel ones below.
                smtp_host: { type: [string, "null"] }
                smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
                smtp_username: { type: [string, "null"] }
                smtp_password: { type: [string, "null"], writeOnly: true }
                smtp_encryption: { type: string, enum: [none, starttls, tls], default: starttls }
                from_address: { type: [string, "null"], format: email }
                from_name: { type: [string, "null"] }

    WebhookChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: webhook }
            config:
              type: object
              description: |
                A generic webhook with full payload templating. Method, headers, and body
                are all user-defined, with variable interpolation — the difference between
                integrating with an arbitrary endpoint and not being able to.
              required: [url]
              properties:
                url: { type: string, format: uri }
                method: { type: string, enum: [POST, PUT, PATCH, GET], default: POST }
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: Header values support the same interpolation as the body.
                body_template:
                  type: [string, "null"]
                  description: |
                    Payload template. Null sends the default JSON event envelope.
                    Preview the rendered result with `/notification-channels/preview`
                    before saving.
                  examples: ["{\"text\": \"{{monitor.name}} is {{status}}\"}"]
                content_type: { type: string, default: "application/json" }
                verify_tls: { type: boolean, default: true }
                timeout_seconds: { type: integer, minimum: 1, maximum: 60, default: 10 }

    SlackChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: slack }
            config:
              type: object
              required: [webhook_url]
              properties:
                webhook_url: { type: string, format: uri, writeOnly: true }
                channel: { type: [string, "null"], description: "Override the incoming webhook's default channel." }
                username: { type: [string, "null"] }
                icon_emoji: { type: [string, "null"] }
                message_template: { type: [string, "null"] }

    DiscordChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: discord }
            config:
              type: object
              required: [webhook_url]
              properties:
                webhook_url: { type: string, format: uri, writeOnly: true }
                username: { type: [string, "null"] }
                avatar_url: { type: [string, "null"], format: uri }
                message_template: { type: [string, "null"] }

    TelegramChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: telegram }
            config:
              type: object
              required: [bot_token, chat_id]
              properties:
                bot_token: { type: string, writeOnly: true }
                chat_id: { type: string }
                message_thread_id: { type: [string, "null"] }
                parse_mode: { type: string, enum: [none, Markdown, MarkdownV2, HTML], default: none }
                disable_notification: { type: boolean, default: false }
                message_template: { type: [string, "null"] }

    MatrixChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: matrix }
            config:
              type: object
              required: [homeserver_url, room_id, access_token]
              properties:
                homeserver_url: { type: string, format: uri }
                room_id: { type: string }
                access_token: { type: string, writeOnly: true }
                message_template: { type: [string, "null"] }

    GotifyChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: gotify }
            config:
              type: object
              required: [server_url, application_token]
              properties:
                server_url: { type: string, format: uri }
                application_token: { type: string, writeOnly: true }
                priority: { type: integer, minimum: 0, maximum: 10, default: 5 }
                message_template: { type: [string, "null"] }

    NtfyChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: ntfy }
            config:
              type: object
              required: [topic]
              properties:
                server_url: { type: string, format: uri, default: "https://ntfy.sh" }
                topic: { type: string }
                priority: { type: integer, minimum: 1, maximum: 5, default: 3 }
                tags: { type: array, items: { type: string } }
                auth_type: { type: string, enum: [none, basic, token], default: none }
                username: { type: [string, "null"] }
                password: { type: [string, "null"], writeOnly: true }
                token: { type: [string, "null"], writeOnly: true }
                message_template: { type: [string, "null"] }

    MsTeamsChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: msteams }
            config:
              type: object
              required: [webhook_url]
              properties:
                webhook_url: { type: string, format: uri, writeOnly: true }
                message_template: { type: [string, "null"] }

    PagerDutyChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: pagerduty }
            config:
              type: object
              description: |
                Events API v2. A monitor going down triggers an incident keyed by monitor
                ID; its recovery resolves the same incident rather than opening a second one.
              required: [integration_key]
              properties:
                integration_key: { type: string, writeOnly: true }
                severity: { type: string, enum: [critical, error, warning, info], default: error }
                auto_resolve: { type: boolean, default: true }
                region: { type: string, enum: [us, eu], default: us }

    OpsgenieChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: opsgenie }
            config:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, writeOnly: true }
                region: { type: string, enum: [us, eu], default: us }
                priority: { type: string, enum: [P1, P2, P3, P4, P5], default: P3 }
                auto_close: { type: boolean, default: true }
                responders:
                  type: array
                  items:
                    type: object
                    required: [type, value]
                    properties:
                      type: { type: string, enum: [team, user, escalation, schedule] }
                      value: { type: string }

    TwilioChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: twilio }
            config:
              type: object
              required: [account_sid, auth_token, from_number, to_numbers]
              properties:
                account_sid: { type: string }
                auth_token: { type: string, writeOnly: true }
                from_number: { type: string }
                to_numbers:
                  type: array
                  minItems: 1
                  items: { type: string }
                message_template:
                  type: [string, "null"]
                  description: SMS is length-limited and billed per segment; the rendered message is truncated at 1,600 characters.

    AppriseChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelCommon"
        - type: object
          required: [name, type, config]
          properties:
            type: { type: string, const: apprise }
            config:
              type: object
              description: |
                The meta-provider. One Apprise URL reaches any of roughly ninety services
                Cairn does not implement natively. Requires Apprise to be available to the
                instance; `capabilities` on `/system/info` reports whether it is.
              required: [urls]
              properties:
                urls:
                  type: array
                  minItems: 1
                  writeOnly: true
                  description: Apprise notification URLs. Credentials are embedded in them, so they are treated as secrets.
                  items: { type: string }
                title_template: { type: [string, "null"] }
                body_template: { type: [string, "null"] }

    NotificationTestResult:
      type: object
      required: [delivered]
      properties:
        delivered: { type: boolean }
        status_code:
          type: [integer, "null"]
          description: The provider's HTTP status, where the transport has one.
        error:
          type: [string, "null"]
          description: The provider's error, passed through rather than summarised — the operator needs the real message.
        duration_ms: { type: number }
        rendered_payload:
          type: [string, "null"]
          description: What was actually sent, for channels that render a template.

    TemplateVariable:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
          examples: ["monitor.name"]
        type: { type: string, enum: [string, number, boolean, timestamp, array, object] }
        description: { type: string }
        example: { description: A sample value of the documented type. }

    TemplatePreviewRequest:
      type: object
      required: [template]
      properties:
        template:
          type: string
          description: The template body to render.
        headers:
          type: object
          description: Optional header templates to render alongside the body.
          additionalProperties: { type: string }
        event:
          allOf:
            - $ref: "#/components/schemas/EventType"
          description: Which event's sample context to render against. Defaults to `monitor.down`.
        monitor_id:
          type: [string, "null"]
          format: uuid
          description: |
            Render against this monitor's real current data instead of the synthetic
            sample, so the preview shows the user their own values.
        context:
          type: [object, "null"]
          description: Explicit context, overriding the sample. Intended for testing.
          additionalProperties: true

    TemplatePreviewResult:
      type: object
      description: |
        A template that fails to render returns 200 with `ok: false` and the error — a
        broken template is a user mistake to be shown inline, not a server fault.
      required: [ok]
      properties:
        ok: { type: boolean }
        rendered_body: { type: [string, "null"] }
        rendered_headers:
          type: [object, "null"]
          additionalProperties: { type: string }
        error:
          type: [object, "null"]
          required: [message]
          properties:
            message: { type: string }
            line: { type: [integer, "null"] }
            column: { type: [integer, "null"] }
        context_used:
          type: object
          description: The context the template was rendered against, so the user can see what was available.
          additionalProperties: true

    # ------------------------------------------------------------------------
    # Maintenance windows
    # ------------------------------------------------------------------------

    MaintenanceState:
      type: string
      enum: [scheduled, active, ended, cancelled]

    MaintenanceStrategy:
      type: string
      description: |
        How the window recurs. `single` is a one-off; `cron` is the escape hatch for
        schedules the named strategies cannot express.
      enum: [single, recurring_daily, recurring_weekly, recurring_monthly, cron]

    MaintenanceWindow:
      type: object
      required: [id, title, strategy, targets]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        strategy: { $ref: "#/components/schemas/MaintenanceStrategy" }
        state:
          allOf:
            - $ref: "#/components/schemas/MaintenanceState"
          readOnly: true
        timezone:
          type: string
          description: IANA timezone the schedule is evaluated in. Recurrence follows local time across DST.
          examples: ["Australia/Sydney"]
        starts_at:
          type: string
          format: date-time
          description: First occurrence. For recurring strategies, the anchor the recurrence is computed from.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: End of a `single` window. Recurring windows use `duration_minutes` instead.
        duration_minutes:
          type: [integer, "null"]
          minimum: 1
          description: Length of each occurrence, for recurring strategies.
        recurrence:
          type: [object, "null"]
          properties:
            weekdays:
              type: array
              description: 0 is Sunday. Used by `recurring_weekly`.
              items: { type: integer, minimum: 0, maximum: 6 }
            days_of_month:
              type: array
              description: Used by `recurring_monthly`. A day past the end of a short month is skipped, not clamped.
              items: { type: integer, minimum: 1, maximum: 31 }
            cron:
              type: [string, "null"]
              description: Five-field cron expression, used by the `cron` strategy.
            until:
              type: [string, "null"]
              format: date-time
              description: Stop recurring after this instant. Null recurs indefinitely.
        targets:
          type: object
          description: |
            What the window covers. A monitor matched by any of these is under maintenance.
            Targeting by tag is what makes a window survive monitors being added later.
          properties:
            monitor_ids: { type: array, items: { type: string, format: uuid } }
            group_ids: { type: array, items: { type: string, format: uuid } }
            tag_ids: { type: array, items: { type: string, format: uuid } }
        suppress_notifications: { type: boolean, default: true }
        show_on_status_pages:
          type: boolean
          default: true
          description: Display the window as scheduled maintenance on the pages listed below.
        status_page_ids:
          type: array
          items: { type: string, format: uuid }
        next_occurrence_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    MaintenanceWindowWrite:
      description: Request body for creating or replacing a maintenance window.
      $ref: "#/components/schemas/MaintenanceWindow"

    # ------------------------------------------------------------------------
    # Incidents
    # ------------------------------------------------------------------------

    IncidentState:
      type: string
      description: The public lifecycle a status page displays.
      enum: [investigating, identified, monitoring, resolved]

    IncidentImpact:
      type: string
      enum: [none, minor, major, critical]

    Incident:
      type: object
      required: [id, title, state, impact, started_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, minLength: 1, maxLength: 300 }
        state: { $ref: "#/components/schemas/IncidentState" }
        impact: { $ref: "#/components/schemas/IncidentImpact" }
        started_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time, readOnly: true }
        monitor_ids:
          type: array
          items: { type: string, format: uuid }
        status_page_ids:
          type: array
          description: Pages this incident is published on. Empty keeps it internal.
          items: { type: string, format: uuid }
        auto_opened:
          type: boolean
          readOnly: true
          default: false
          description: True when opened automatically from a failing check. Phase 3 onward.
        acknowledged_at: { type: [string, "null"], format: date-time, readOnly: true }
        acknowledged_by: { type: [string, "null"], format: uuid, readOnly: true }
        assigned_to: { type: [string, "null"], format: uuid }
        updates:
          type: array
          readOnly: true
          description: The timeline, oldest first.
          items: { $ref: "#/components/schemas/IncidentTimelineEntry" }
        metrics:
          type: [object, "null"]
          readOnly: true
          description: |
            Response-time metrics derived from the timeline. Populated as the relevant
            timestamps exist; MTTA requires acknowledgement, which arrives in Phase 3.
          properties:
            time_to_detect_seconds: { type: [integer, "null"] }
            time_to_acknowledge_seconds: { type: [integer, "null"] }
            time_to_resolve_seconds: { type: [integer, "null"] }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    IncidentWrite:
      type: object
      required: [title, impact]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        state:
          allOf:
            - $ref: "#/components/schemas/IncidentState"
          default: investigating
        impact: { $ref: "#/components/schemas/IncidentImpact" }
        started_at:
          type: string
          format: date-time
          description: Defaults to now. Set it in the past when recording an incident after the fact.
        monitor_ids: { type: array, items: { type: string, format: uuid } }
        status_page_ids: { type: array, items: { type: string, format: uuid } }
        body:
          type: [string, "null"]
          description: Opening timeline entry. Optional, but an incident with no first update says nothing.
        notify_subscribers: { type: boolean, default: true }

    IncidentUpdateRequest:
      type: object
      description: Metadata-only update. State changes go through the timeline.
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        impact: { $ref: "#/components/schemas/IncidentImpact" }
        started_at: { type: string, format: date-time }
        monitor_ids: { type: array, items: { type: string, format: uuid } }
        status_page_ids: { type: array, items: { type: string, format: uuid } }
        assigned_to: { type: [string, "null"], format: uuid }

    IncidentTimelineEntry:
      type: object
      required: [id, body, created_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        state:
          allOf:
            - $ref: "#/components/schemas/IncidentState"
          description: The state this entry moved the incident to, if any.
        body: { type: string, minLength: 1, maxLength: 20000 }
        author_id: { type: [string, "null"], format: uuid, readOnly: true }
        notified_subscribers: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    IncidentTimelineEntryWrite:
      type: object
      required: [body]
      properties:
        state: { $ref: "#/components/schemas/IncidentState" }
        body: { type: string, minLength: 1, maxLength: 20000 }
        notify_subscribers: { type: boolean, default: true }

    # ------------------------------------------------------------------------
    # Status pages
    # ------------------------------------------------------------------------

    StatusPage:
      type: object
      required: [id, slug, title]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$"
          description: URL path segment. Unique across the instance.
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        published:
          type: boolean
          default: false
          description: An unpublished page is invisible on the public path, so it can be built before launch.
        custom_domain:
          type: [string, "null"]
          description: |
            Hostname this page is served on. Certificate issuance and DNS are the
            operator's, handled at the reverse proxy — the docs carry Caddy, nginx, and
            Traefik recipes.
        visibility:
          type: string
          enum: [public, password]
          default: public
        password:
          type: [string, "null"]
          writeOnly: true
          description: Required when `visibility` is `password`. Never returned.
        theme: { type: string, enum: [light, dark, auto], default: auto }
        logo_url: { type: [string, "null"], format: uri }
        favicon_url: { type: [string, "null"], format: uri }
        primary_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        footer_text: { type: [string, "null"], maxLength: 2000 }
        custom_css:
          type: [string, "null"]
          maxLength: 50000
          description: Injected into the public page. Sanitised, and never able to introduce script.
        timezone: { type: [string, "null"], description: "Display timezone. Null uses the instance default." }
        show_uptime_percentage: { type: boolean, default: true }
        show_response_time_chart: { type: boolean, default: false }
        uptime_bar_days: { type: integer, minimum: 7, maximum: 365, default: 90 }
        show_powered_by:
          type: boolean
          default: true
          description: Attribution link. Removable — nothing in the open source build is paywalled.
        subscriptions_enabled: { type: boolean, default: false }
        google_analytics_id: { type: [string, "null"] }
        sections:
          type: array
          description: |
            Ordered groupings of monitors as visitors see them. A monitor may appear in
            only one section per page.
          items:
            type: object
            required: [name, monitor_ids]
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              description: { type: [string, "null"], maxLength: 2000 }
              monitor_ids:
                type: array
                items: { type: string, format: uuid }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    StatusPageWrite:
      description: Request body for creating or replacing a status page.
      $ref: "#/components/schemas/StatusPage"

    PublicStatusPage:
      type: object
      description: |
        The visitor-facing view. Contains only what a status page displays — no monitor
        configuration, no internal identifiers beyond what rendering needs, and nothing
        about monitors the page does not list.
      required: [slug, title, overall_status, sections, generated_at]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        theme: { type: string, enum: [light, dark, auto] }
        logo_url: { type: [string, "null"], format: uri }
        favicon_url: { type: [string, "null"], format: uri }
        primary_color: { type: [string, "null"] }
        footer_text: { type: [string, "null"] }
        custom_css: { type: [string, "null"] }
        show_powered_by: { type: boolean }
        subscriptions_enabled: { type: boolean }
        overall_status:
          type: string
          enum: [operational, degraded, partial_outage, major_outage, maintenance]
        sections:
          type: array
          items:
            type: object
            required: [name, monitors]
            properties:
              name: { type: string }
              description: { type: [string, "null"] }
              monitors:
                type: array
                items: { $ref: "#/components/schemas/PublicMonitorSummary" }
        active_incidents:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
        recent_incidents:
          type: array
          description: Recently resolved incidents, within the page's display window.
          items: { $ref: "#/components/schemas/PublicIncident" }
        scheduled_maintenance:
          type: array
          items:
            type: object
            required: [title, starts_at]
            properties:
              title: { type: string }
              description: { type: [string, "null"] }
              starts_at: { type: string, format: date-time }
              ends_at: { type: [string, "null"], format: date-time }
              affected_monitor_ids: { type: array, items: { type: string, format: uuid } }
        generated_at: { type: string, format: date-time }

    PublicMonitorSummary:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        uptime_percentage: { type: [number, "null"], minimum: 0, maximum: 100 }
        uptime_bar:
          type: array
          description: |
            One entry per day over the page's configured window, oldest first, for the
            stacked-stones uptime bar. Days with no data carry a null ratio rather than
            being reported as downtime.
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              uptime_ratio: { type: [number, "null"], minimum: 0, maximum: 1 }
              status: { type: [string, "null"], enum: [up, down, degraded, maintenance, null] }
        response_time_ms: { type: [number, "null"] }

    PublicIncident:
      type: object
      required: [id, title, state, impact, started_at, updates]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        state: { $ref: "#/components/schemas/IncidentState" }
        impact: { $ref: "#/components/schemas/IncidentImpact" }
        started_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        affected_monitor_ids: { type: array, items: { type: string, format: uuid } }
        updates:
          type: array
          items:
            type: object
            required: [body, created_at]
            properties:
              state: { $ref: "#/components/schemas/IncidentState" }
              body: { type: string }
              created_at: { type: string, format: date-time }

    Subscriber:
      type: object
      required: [id, channel, target, confirmed, created_at]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [email, webhook] }
        target:
          type: string
          description: The email address or webhook URL, partially masked on read.
        confirmed: { type: boolean }
        confirmed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SubscribeRequest:
      type: object
      required: [channel, target]
      properties:
        channel: { type: string, enum: [email, webhook] }
        target: { type: string }

    # ------------------------------------------------------------------------
    # Outbound webhooks
    # ------------------------------------------------------------------------

    Webhook:
      type: object
      required: [id, url, events]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          description: Events to deliver. Clients must ignore event types they do not recognise.
          items: { $ref: "#/components/schemas/EventType" }
        enabled: { type: boolean, default: true }
        headers:
          type: object
          description: Additional request headers. Values are stored encrypted and redacted on read.
          additionalProperties: { type: string }
        verify_tls: { type: boolean, default: true }
        secret_prefix:
          type: string
          readOnly: true
          description: Leading characters of the signing secret, so it can be identified without being exposed.
        last_delivery_at: { type: [string, "null"], format: date-time, readOnly: true }
        last_delivery_outcome:
          type: [string, "null"]
          enum: [succeeded, failed, null]
          readOnly: true
        consecutive_failures:
          type: integer
          readOnly: true
          description: |
            A subscription is disabled automatically after a sustained run of failures,
            and the operator is notified — a dead endpoint should not be retried forever.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    WebhookWrite:
      type: object
      required: [url, events]
      properties:
        name: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EventType" }
        enabled: { type: boolean, default: true }
        headers:
          type: object
          additionalProperties: { type: string }
        verify_tls: { type: boolean, default: true }

    WebhookCreated:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                HMAC-SHA256 signing secret. Returned once, on creation. Verify each
                delivery by recomputing the signature over the raw request body.

    WebhookDelivery:
      type: object
      required: [id, event, outcome, attempt, created_at]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: "#/components/schemas/EventType" }
        outcome: { type: string, enum: [succeeded, failed, pending] }
        attempt:
          type: integer
          minimum: 1
          description: Retries use exponential backoff; each attempt is logged separately.
        request_body: { type: [string, "null"] }
        response_status: { type: [integer, "null"] }
        response_body:
          type: [string, "null"]
          description: Truncated to a bounded length so a chatty endpoint cannot fill the log.
        error: { type: [string, "null"] }
        duration_ms: { type: [number, "null"] }
        created_at: { type: string, format: date-time }
        next_retry_at: { type: [string, "null"], format: date-time }

    EventEnvelope:
      type: object
      description: |
        The default payload delivered to outbound webhooks and rendered into notification
        templates. Not returned by any endpoint — documented here because it is part of
        the contract, and a receiver has to be able to write against it.
      required: [id, type, occurred_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: Unique per event. Stable across retries, so receivers can deduplicate.
        type: { $ref: "#/components/schemas/EventType" }
        occurred_at: { type: string, format: date-time }
        instance:
          type: object
          properties:
            name: { type: string }
            base_url: { type: string, format: uri }
            version: { type: string }
        data:
          type: object
          description: |
            The event subject. Shape follows the event type — a `monitor.*` event carries
            `monitor` and `heartbeat`; an `incident.*` event carries `incident`.
          properties:
            monitor: { $ref: "#/components/schemas/Monitor" }
            heartbeat: { $ref: "#/components/schemas/Heartbeat" }
            previous_status: { $ref: "#/components/schemas/MonitorStatus" }
            incident: { $ref: "#/components/schemas/Incident" }
            maintenance_window: { $ref: "#/components/schemas/MaintenanceWindow" }
            report_run: { $ref: "#/components/schemas/ReportRun" }

    # ------------------------------------------------------------------------
    # Import
    # ------------------------------------------------------------------------

    KumaImportRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          description: |
            One or more Uptime Kuma SQLite databases. Several files performs the
            multi-instance merge.
          items: { type: string, format: binary }
        options:
          type: object
          properties:
            dry_run:
              type: boolean
              default: false
              description: Produce the full report without writing anything.
            conflict_strategy:
              type: string
              enum: [skip, rename, replace]
              default: rename
              description: |
                What to do when an imported entity collides with an existing one by name.
                `rename` suffixes the incoming entity, which is the only option that
                cannot lose data.
            name_prefix:
              type: [string, "null"]
              description: |
                Prefix applied to imported monitor names. The practical way to keep several
                merged Kuma instances distinguishable afterwards.
            import_monitors: { type: boolean, default: true }
            import_tags: { type: boolean, default: true }
            import_notifications: { type: boolean, default: true }
            import_status_pages: { type: boolean, default: true }
            import_history:
              type: boolean
              default: false
              description: Import historical heartbeats as well as configuration. Slower, and larger.
            enable_after_import:
              type: boolean
              default: false
              description: |
                Leave imported monitors paused by default, so a migrating user reviews
                them before five thousand checks start firing at once.

    ImportJob:
      type: object
      required: [id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, succeeded, partial, failed] }
        dry_run: { type: boolean }
        sources:
          type: array
          description: One entry per uploaded database.
          items:
            type: object
            properties:
              filename: { type: string }
              kuma_version: { type: [string, "null"] }
              detected_entities:
                type: object
                additionalProperties: { type: integer }
        summary:
          type: object
          description: Counts by entity type and outcome.
          additionalProperties:
            type: object
            properties:
              imported: { type: integer }
              renamed: { type: integer }
              skipped: { type: integer }
              failed: { type: integer }
        entries:
          type: array
          description: |
            Per-entity outcomes. Every source entity appears exactly once — the guarantee
            that nothing was silently dropped.
          items:
            type: object
            required: [source_file, entity_type, source_name, result]
            properties:
              source_file: { type: string }
              entity_type: { type: string, enum: [monitor, tag, notification, status_page, heartbeat_range] }
              source_id: { type: [string, "null"] }
              source_name: { type: string }
              result: { type: string, enum: [imported, renamed, skipped, failed, unsupported] }
              target_id: { type: [string, "null"], format: uuid }
              detail:
                type: [string, "null"]
                description: |
                  Why, in plain language — an unsupported monitor type, a notification
                  provider with no Cairn equivalent, a name collision and what was done about it.
        error: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------------------
    # Settings and users
    # ------------------------------------------------------------------------

    Settings:
      type: object
      description: Instance-wide configuration. Every section is optional on update.
      properties:
        general:
          type: object
          properties:
            instance_name: { type: string, maxLength: 200 }
            base_url:
              type: string
              format: uri
              description: Public URL of this install. Used to build push URLs, status page links, and report links.
            timezone: { type: string }
            locale: { type: string, examples: ["en"] }
        appearance:
          type: object
          properties:
            theme: { type: string, enum: [light, dark, auto] }
            primary_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
        retention:
          type: object
          description: |
            Retention per rollup tier, in days, matching the pipeline in ADR-002. Coarser
            tiers must be retained at least as long as finer ones; zero means keep indefinitely.
          properties:
            raw_days: { type: integer, minimum: 1, default: 7 }
            rollup_1m_days: { type: integer, minimum: 0, default: 30 }
            rollup_5m_days: { type: integer, minimum: 0, default: 90 }
            rollup_1h_days: { type: integer, minimum: 0, default: 365 }
            rollup_1d_days: { type: integer, minimum: 0, default: 0 }
            webhook_delivery_days: { type: integer, minimum: 1, default: 30 }
        smtp:
          type: object
          description: Instance-wide SMTP, used by email channels that do not carry their own.
          properties:
            host: { type: [string, "null"] }
            port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
            username: { type: [string, "null"] }
            password: { type: [string, "null"], writeOnly: true }
            encryption: { type: string, enum: [none, starttls, tls] }
            from_address: { type: [string, "null"], format: email }
            from_name: { type: [string, "null"] }
        monitoring:
          type: object
          properties:
            default_interval_seconds: { type: integer, minimum: 20, default: 60 }
            default_timeout_seconds: { type: integer, minimum: 1, default: 30 }
            default_retries: { type: integer, minimum: 0, default: 0 }
            default_notification_channel_ids:
              type: array
              items: { type: string, format: uuid }
            max_concurrent_checks:
              type: [integer, "null"]
              minimum: 1
              description: Scheduler concurrency ceiling. Null lets the scheduler size itself.
        security:
          type: object
          properties:
            session_timeout_minutes: { type: integer, minimum: 5, default: 43200 }
            login_rate_limit_per_minute: { type: integer, minimum: 1, default: 10 }
            api_rate_limit_per_minute: { type: [integer, "null"], minimum: 1 }
            require_totp:
              type: boolean
              default: false
              description: Require TOTP for every account that can sign in.
            trusted_proxies:
              type: array
              description: CIDR ranges whose forwarded-for headers are honoured. Empty trusts none.
              items: { type: string }
        telemetry:
          type: object
          description: |
            Off by default and never enabled without an explicit action. Your data is yours.
          properties:
            enabled: { type: boolean, default: false }
            last_sent_at: { type: [string, "null"], format: date-time, readOnly: true }

    UserRole:
      type: string
      description: |
        Phase 1 installs have a single `owner`. The remaining roles are enforced from
        Phase 3; they are named here so the enum does not have to change later.
      enum: [owner, admin, editor, responder, viewer, billing]

    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        email: { type: string, format: email }
        name: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean, default: true }
        totp_enabled: { type: boolean, readOnly: true }
        timezone: { type: [string, "null"] }
        locale: { type: [string, "null"] }
        last_login_at: { type: [string, "null"], format: date-time, readOnly: true }
        team_ids:
          type: array
          readOnly: true
          description: Populated from Phase 3.
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    UserWrite:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        name: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        password:
          type: [string, "null"]
          minLength: 12
          writeOnly: true
          description: Omit to send an invitation instead of setting a password directly.
        timezone: { type: [string, "null"] }
        locale: { type: [string, "null"] }

    CurrentUserUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: [string, "null"], maxLength: 200 }
        timezone: { type: [string, "null"] }
        locale: { type: [string, "null"] }
        current_password:
          type: string
          writeOnly: true
          description: Required when changing email or password.
        new_password:
          type: string
          minLength: 12
          writeOnly: true

    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        members:
          type: array
          items:
            type: object
            required: [user_id, role]
            properties:
              user_id: { type: string, format: uuid }
              role: { $ref: "#/components/schemas/UserRole" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    TeamWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        members:
          type: array
          items:
            type: object
            required: [user_id, role]
            properties:
              user_id: { type: string, format: uuid }
              role: { $ref: "#/components/schemas/UserRole" }

    # ------------------------------------------------------------------------
    # On-call (Phase 3)
    # ------------------------------------------------------------------------

    OnCallSchedule:
      type: object
      required: [id, name, timezone, rotations]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        timezone: { type: string }
        rotations:
          type: array
          items:
            type: object
            required: [name, participants, length]
            properties:
              name: { type: string }
              participants:
                type: array
                minItems: 1
                description: User identifiers in rotation order.
                items: { type: string, format: uuid }
              length: { type: string, enum: [daily, weekly, biweekly, custom] }
              length_hours: { type: [integer, "null"], minimum: 1, description: "Required when length is custom." }
              handoff_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
              starts_at: { type: string, format: date-time }
              restriction:
                type: [object, "null"]
                description: Limit the rotation to given hours and weekdays — business-hours-only routing.
                properties:
                  weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
                  start_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                  end_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        overrides:
          type: array
          description: One-off cover, which takes precedence over the computed rotation.
          items:
            type: object
            required: [user_id, starts_at, ends_at]
            properties:
              id: { type: string, format: uuid, readOnly: true }
              user_id: { type: string, format: uuid }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    OnCallScheduleWrite:
      description: Request body for creating or replacing an on-call schedule.
      $ref: "#/components/schemas/OnCallSchedule"

    OnCallShift:
      type: object
      required: [user_id, starts_at, ends_at]
      properties:
        user_id: { type: string, format: uuid }
        rotation_name: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        is_override: { type: boolean, default: false }

    EscalationPolicy:
      type: object
      required: [id, name, steps]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        steps:
          type: array
          minItems: 1
          description: Evaluated in order. A step fires once the previous step's delay elapses unacknowledged.
          items:
            type: object
            required: [delay_minutes, targets]
            properties:
              delay_minutes: { type: integer, minimum: 0 }
              targets:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [type, id]
                  properties:
                    type: { type: string, enum: [user, team, schedule, notification_channel] }
                    id: { type: string, format: uuid }
        repeat_count:
          type: integer
          minimum: 0
          default: 0
          description: How many times to repeat the whole policy while unacknowledged. Zero does not repeat.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    EscalationPolicyWrite:
      description: Request body for creating or replacing an escalation policy.
      $ref: "#/components/schemas/EscalationPolicy"

    # ------------------------------------------------------------------------
    # Reports (Phase 2)
    # ------------------------------------------------------------------------

    ReportFormat:
      type: string
      enum: [pdf, html, csv, json]

    ReportTemplate:
      type: object
      required: [id, name, type, scope, formats]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        type:
          type: string
          enum: [uptime, sla, post_mortem, comparative, custom]
          description: |
            `sla` reports target versus actual with error budget consumed and remaining —
            what a contract review actually needs. `post_mortem` is drafted from an
            incident timeline.
        scope:
          type: object
          description: What the report covers. Sources combine as a union.
          properties:
            monitor_ids: { type: array, items: { type: string, format: uuid } }
            group_ids: { type: array, items: { type: string, format: uuid } }
            tag_ids: { type: array, items: { type: string, format: uuid } }
            incident_id:
              type: [string, "null"]
              format: uuid
              description: For `post_mortem` reports.
        period:
          type: string
          enum: [day, week, month, quarter, year, custom]
          default: month
        sla_target:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Target uptime percentage for `sla` reports.
        maintenance_handling:
          type: string
          enum: [exclude, count_as_up, count_as_down]
          default: exclude
          description: How maintenance time counts toward the reported figure. Stated in the output.
        branding:
          type: object
          description: |
            White-labelling — the client receives a report that looks like their agency
            made it. Ships in the AGPL build like everything else.
          properties:
            logo_url: { type: [string, "null"], format: uri }
            primary_color: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
            company_name: { type: [string, "null"] }
            footer_text: { type: [string, "null"] }
            hide_powered_by: { type: boolean, default: false }
        sections:
          type: array
          description: Ordered content blocks. Omitting this uses the defaults for the report type.
          items:
            type: string
            enum: [summary, uptime_table, uptime_chart, response_time_chart, incident_log, sla_breakdown, error_budget, maintenance_log, certificate_expiry, comparison]
        formats:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReportFormat" }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ReportTemplateWrite:
      description: Request body for creating or replacing a report template.
      $ref: "#/components/schemas/ReportTemplate"

    ReportGenerateRequest:
      type: object
      properties:
        period_start:
          type: [string, "null"]
          format: date-time
          description: Defaults to the most recently completed period for the template.
        period_end: { type: [string, "null"], format: date-time }
        formats:
          type: array
          description: Overrides the template's formats for this run.
          items: { $ref: "#/components/schemas/ReportFormat" }
        deliver:
          type: boolean
          default: false
          description: Also deliver through the template's schedules, rather than only generating.

    ReportSchedule:
      type: object
      required: [id, report_template_id, frequency, deliveries]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        report_template_id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true }
        frequency: { type: string, enum: [daily, weekly, monthly, quarterly, cron] }
        cron: { type: [string, "null"], description: "Five-field cron expression, when frequency is cron." }
        timezone: { type: string }
        send_at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", default: "09:00" }
        deliveries:
          type: array
          minItems: 1
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [email, slack, webhook, s3] }
              recipients:
                type: array
                description: Email recipients.
                items: { type: string, format: email }
              notification_channel_id:
                type: [string, "null"]
                format: uuid
                description: Deliver through an existing channel rather than restating its configuration.
              url: { type: [string, "null"], format: uri }
              s3:
                type: [object, "null"]
                properties:
                  bucket: { type: string }
                  prefix: { type: [string, "null"] }
                  region: { type: [string, "null"] }
                  endpoint: { type: [string, "null"], format: uri }
                  access_key_id: { type: [string, "null"], writeOnly: true }
                  secret_access_key: { type: [string, "null"], writeOnly: true }
              formats:
                type: array
                items: { $ref: "#/components/schemas/ReportFormat" }
        last_run_at: { type: [string, "null"], format: date-time, readOnly: true }
        next_run_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ReportScheduleWrite:
      description: Request body for creating or replacing a report schedule.
      $ref: "#/components/schemas/ReportSchedule"

    ReportRun:
      type: object
      required: [id, report_template_id, state, period_start, period_end, created_at]
      properties:
        id: { type: string, format: uuid }
        report_template_id: { type: string, format: uuid }
        report_schedule_id: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [queued, running, succeeded, failed] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        artifacts:
          type: array
          items:
            type: object
            required: [format]
            properties:
              format: { $ref: "#/components/schemas/ReportFormat" }
              size_bytes: { type: [integer, "null"] }
              download_url:
                type: [string, "null"]
                format: uri
                description: Authenticated download path for this artefact.
        share_url:
          type: [string, "null"]
          format: uri
          description: Public shareable link, when the run was generated with sharing enabled.
        share_expires_at: { type: [string, "null"], format: date-time }
        deliveries:
          type: array
          description: Delivery outcomes for this run.
          items:
            type: object
            properties:
              type: { type: string, enum: [email, slack, webhook, s3] }
              outcome: { type: string, enum: [succeeded, failed, skipped] }
              error: { type: [string, "null"] }
              delivered_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
