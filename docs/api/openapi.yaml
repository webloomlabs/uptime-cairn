      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Delete a tag
      description: The tag is removed from every monitor carrying it. Monitors are not deleted.
      x-cairn-phase: 1
      x-cairn-scopes: [tags:write]
      responses:
        "204": { description: Tag deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Notification channels
  # --------------------------------------------------------------------------

  /api/v1/notification-channels:
    get:
      tags: [Notification Channels]
      operationId: listNotificationChannels
      summary: List notification channels
      description: Secrets in channel configuration are redacted on read and never returned in full.
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/NotificationChannelType" }
          style: form
          explode: true
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of channels.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationChannel" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Notification Channels]
      operationId: createNotificationChannel
      summary: Create a notification channel
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelWrite" }
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/notification-channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [Notification Channels]
      operationId: getNotificationChannel
      summary: Retrieve a notification channel
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:read]
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Notification Channels]
      operationId: updateNotificationChannel
      summary: Update a notification channel
      description: |
        Redacted secret fields may be omitted to leave them unchanged. Supplying a new
        value replaces the stored secret.
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelUpdate" }
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Notification Channels]
      operationId: deleteNotificationChannel
      summary: Delete a notification channel
      description: The channel is detached from every monitor that referenced it.
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:write]
      responses:
        "204": { description: Channel deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notification-channels/{channelId}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      tags: [Notification Channels]
      operationId: testNotificationChannel
      summary: Send a test notification
      description: |
        Delivers a sample notification through the channel and reports the provider's
        response. Every channel has this button in the UI, because a channel that fails
        silently at 3am is worse than no channel at all.
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:write]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sample_event:
                  allOf:
                    - $ref: "#/components/schemas/EventType"
                  description: Which event shape to simulate. Defaults to `monitor.down`.
      responses:
        "200":
          description: Delivery outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notification-channels/preview:
    post:
      tags: [Notification Channels]
      operationId: previewNotificationTemplate
      summary: Render a webhook template without sending it
      description: |
        Renders a webhook payload template against a sample or supplied context and
        returns the result, so the UI can show exactly what will be sent before the
        channel is saved. Template errors come back as a rendering error, not a 5xx.

        This endpoint does not require an existing channel and sends nothing.
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:read]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplatePreviewRequest" }
      responses:
        "200":
          description: The rendered payload, or the template error that prevented rendering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePreviewResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/notification-channels/template-variables:
    get:
      tags: [Notification Channels]
      operationId: listTemplateVariables
      summary: List available template variables
      description: |
        The interpolation variables available to webhook templates, with types and
        example values. Published as an endpoint so the UI's autocomplete and the
        documentation cannot drift from what the renderer actually supports.
      x-cairn-phase: 1
      x-cairn-scopes: [notifications:read]
      responses:
        "200":
          description: Available variables.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateVariable" }
        "401": { $ref: "#/components/responses/Unauthorized" }

