              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Maintenance Windows]
      operationId: deleteMaintenanceWindow
      summary: Delete a maintenance window
      description: |
        Deletes the schedule. History already annotated as under maintenance keeps that
        annotation — past uptime figures do not silently change because a window was removed.
      x-cairn-phase: 1
      x-cairn-scopes: [maintenance:write]
      responses:
        "204": { description: Window deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Incidents
  # --------------------------------------------------------------------------

  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List incidents
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/Search"
        - name: state
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/IncidentState" }
          style: form
          explode: true
        - name: impact
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/IncidentImpact" }
          style: form
          explode: true
        - name: monitor_id
          in: query
          schema: { type: string, format: uuid }
        - name: status_page_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: A page of incidents.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Incidents]
      operationId: createIncident
      summary: Open an incident
      description: |
        In Phase 1 incidents are opened by a human or by an API client. Phase 3 adds
        automatic opening from failing checks; incidents created that way are marked
        `auto_opened` and are otherwise identical.
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentWrite" }
      responses:
        "201":
          description: Incident opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/incidents/{incidentId}:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    get:
      tags: [Incidents]
      operationId: getIncident
      summary: Retrieve an incident
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:read]
      responses:
        "200":
          description: The incident, including its timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Incidents]
      operationId: updateIncident
      summary: Update an incident
      description: |
        Edits incident metadata. Advancing the incident's state is done by posting an
        update to the timeline, so that every state change carries the note explaining it.
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdateRequest" }
      responses:
        "200":
          description: The updated incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Incidents]
      operationId: deleteIncident
      summary: Delete an incident
      description: Removes the incident and its timeline from status pages and history.
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:write]
      responses:
        "204": { description: Incident deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/incidents/{incidentId}/updates:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    get:
      tags: [Incidents]
      operationId: listIncidentUpdates
      summary: List timeline entries
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:read]
      responses:
        "200":
          description: The timeline, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/IncidentTimelineEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Incidents]
      operationId: createIncidentUpdate
      summary: Post a timeline entry
      description: |
        Appends an update and, if `state` is supplied, advances the incident to it.
        Posting a `resolved` update closes the incident and stamps `resolved_at`.
        Notifies status page subscribers when `notify_subscribers` is true.
      x-cairn-phase: 1
      x-cairn-scopes: [incidents:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentTimelineEntryWrite" }
      responses:
        "201":
          description: Timeline entry created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentTimelineEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/incidents/{incidentId}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      tags: [Incidents]
      operationId: acknowledgeIncident
      summary: Acknowledge an incident
      description: |
        Records who took ownership and when — the input to MTTA in Phase 2's post-mortem
        reports. Ships with the on-call work in Phase 3.
      x-cairn-phase: 3
      x-cairn-scopes: [incidents:write]
      responses:
        "200":
          description: The acknowledged incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # --------------------------------------------------------------------------
  # Status pages
  # --------------------------------------------------------------------------

  /api/v1/status-pages:
    get:
      tags: [Status Pages]
      operationId: listStatusPages
      summary: List status pages
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/Search"
        - name: published
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of status pages.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StatusPage" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Status Pages]
      operationId: createStatusPage
      summary: Create a status page
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageWrite" }
      responses:
        "201":
          description: Status page created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/status-pages/{statusPageId}:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
    get:
      tags: [Status Pages]
      operationId: getStatusPage
      summary: Retrieve a status page
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:read]
      responses:
        "200":
          description: The status page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Status Pages]
      operationId: updateStatusPage
      summary: Update a status page
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageWrite" }
      responses:
        "200":
          description: The updated status page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Status Pages]
      operationId: deleteStatusPage
      summary: Delete a status page
      description: The page and its subscriber list are removed. Monitors are unaffected.
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:write]
      responses:
        "204": { description: Status page deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{statusPageId}/subscribers:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
    get:
      tags: [Status Pages]
      operationId: listStatusPageSubscribers
      summary: List subscribers
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - name: confirmed
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of subscribers.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Subscriber" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/status-pages/{statusPageId}/subscribers/{subscriberId}:
    parameters:
      - $ref: "#/components/parameters/StatusPageId"
      - name: subscriberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Status Pages]
      operationId: deleteStatusPageSubscriber
      summary: Remove a subscriber
      x-cairn-phase: 1
      x-cairn-scopes: [status_pages:write]
      responses:
        "204": { description: Subscriber removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Public status page surface
  # --------------------------------------------------------------------------

  /api/v1/public/status-pages/{slug}:
    parameters:
      - $ref: "#/components/parameters/StatusPageSlug"
    get:
      tags: [Public]
      operationId: getPublicStatusPage
      summary: Read a published status page
      description: |
        The unauthenticated read path a status page's own frontend consumes. Cacheable,
        and required to stay fast under load independently of the authenticated API —
        a status page that falls over during the outage it is reporting is worthless.

        Password-protected pages require the visitor token issued by
        `POST /api/v1/public/status-pages/{slug}/authenticate`.
      security: []
      x-cairn-phase: 1
      parameters:
        - name: X-Cairn-Status-Page-Token
          in: header
          required: false
          description: Visitor token for a password-protected page.
          schema: { type: string }
      responses:
        "200":
          description: The published page and its current state.
          headers:
            Cache-Control:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/status-pages/{slug}/authenticate:
    parameters:
      - $ref: "#/components/parameters/StatusPageSlug"
    post:
      tags: [Public]
      operationId: authenticatePublicStatusPage
      summary: Exchange a page password for a visitor token
      security: []
      x-cairn-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: A visitor token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/status-pages/{slug}/subscribers:
    parameters:
      - $ref: "#/components/parameters/StatusPageSlug"
    post:
      tags: [Public]
      operationId: subscribeToStatusPage
      summary: Subscribe to status page updates
      description: |
        Creates an unconfirmed subscription and sends a confirmation. Always responds
        201 whether or not the address was already subscribed, so the endpoint cannot
        be used to enumerate subscribers.
      security: []
      x-cairn-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscribeRequest" }
      responses:
        "201": { description: Confirmation sent if the address was eligible. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/subscriptions/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The opaque token from a confirmation or unsubscribe link.
        schema: { type: string }
    post:
      tags: [Public]
      operationId: confirmSubscription
      summary: Confirm a subscription
      security: []
      x-cairn-phase: 1
      responses:
        "204": { description: Subscription confirmed. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Public]
      operationId: unsubscribe
      summary: Unsubscribe
      description: One click, no login, no confirmation step.
      security: []
      x-cairn-phase: 1
      responses:
        "204": { description: Unsubscribed. }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Outbound webhooks
  # --------------------------------------------------------------------------

  /api/v1/webhooks:
    get:
      tags: [Outbound Webhooks]
      operationId: listWebhooks
      summary: List event subscriptions
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Outbound Webhooks]
      operationId: createWebhook
      summary: Subscribe to events
      description: |
        Deliveries are signed with HMAC-SHA256 over the raw body, sent as
        `X-Cairn-Signature: t=<unix>,v1=<hex>`, and carry `X-Cairn-Event`,
        `X-Cairn-Delivery`, and `X-Cairn-Attempt` headers. The signing secret is
        returned once on creation.
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "201":
          description: Subscription created. `secret` is shown once and never again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [Outbound Webhooks]
      operationId: getWebhook
      summary: Retrieve a subscription
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:read]
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Outbound Webhooks]
      operationId: updateWebhook
      summary: Update a subscription
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Outbound Webhooks]
      operationId: deleteWebhook
      summary: Delete a subscription
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:write]
      responses:
        "204": { description: Subscription deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [Outbound Webhooks]
      operationId: listWebhookDeliveries
      summary: List delivery attempts
      description: |
        The delivery log, newest first. Retained for a configurable window so that
        "did the alert actually leave the building?" has an answer that is not a guess.
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: outcome
          in: query
          schema:
            type: array
            items: { type: string, enum: [succeeded, failed, pending] }
          style: form
          explode: true
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/webhooks/{webhookId}/deliveries/{deliveryId}/redeliver:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Outbound Webhooks]
      operationId: redeliverWebhook
      summary: Replay a delivery
      description: Re-sends the original payload with a new delivery identifier and a fresh signature.
      x-cairn-phase: 1
      x-cairn-scopes: [webhooks:write]
      responses:
        "202":
          description: Redelivery queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Import
  # --------------------------------------------------------------------------

  /api/v1/imports/kuma:
    post:
      tags: [Import]
      operationId: importFromKuma
      summary: Import from one or more Uptime Kuma databases
      description: |
        Accepts one or several `kuma.db` files and reproduces monitors, tags,
        notification channels, and status pages. Supplying several files performs the
        multi-instance merge — the migration path for everyone currently sharding Kuma
        by hand across hosts.

        Import runs asynchronously. Poll the returned job for its status and report;
        nothing is silently dropped, and `dry_run` produces the same report without
        writing anything.
      x-cairn-phase: 1
      x-cairn-scopes: [imports:write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/KumaImportRequest" }
            encoding:
              files:
                contentType: application/octet-stream
              options:
                contentType: application/json
      responses:
        "202":
          description: Import accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/imports/{importJobId}:
    parameters:
      - name: importJobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Import]
      operationId: getImportJob
      summary: Retrieve an import job and its report
      description: |
        The report names every source entity and its outcome — imported, renamed,
        skipped, or failed, with the reason. This is the artefact a migrating user
        reads to confirm nothing was lost.
      x-cairn-phase: 1
      x-cairn-scopes: [imports:write]
      responses:
        "200":
          description: The import job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Settings
  # --------------------------------------------------------------------------

  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Retrieve instance settings
      x-cairn-phase: 1
      x-cairn-scopes: [settings:read]
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Update instance settings
      description: Partial update. Omitted sections and fields are left unchanged.
      x-cairn-phase: 1
      x-cairn-scopes: [settings:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
