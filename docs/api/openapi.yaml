openapi: 3.1.0

# ============================================================================
# Uptime Cairn — REST API v1
#
# STATUS: DRAFT. Not frozen. See docs/api/README.md for the conventions this
# spec follows, the open questions that still need a human decision, and the
# freeze process. Once frozen, this file is immutable except through the
# documented change process.
#
# Every operation carries an `x-cairn-phase` extension naming the roadmap phase
# in which it ships. Phase 1 contract tests select `x-cairn-phase: 1`.
# ============================================================================

info:
  title: Uptime Cairn API
  version: 1.0.0-draft
  summary: All-in-one open source uptime monitoring and reporting platform.
  description: |
    The complete public surface of Uptime Cairn. The dashboard is the first
    client of this API, never a privileged one — there are no internal
    endpoints the UI can reach that an API key cannot.

    ## Authentication

    Two schemes, either of which authenticates any non-public operation:

    - `ApiKeyAuth` — `Authorization: Bearer cairn_<key>`. Scoped, expiring,
      revocable. The scheme for automation, CI/CD, and Terraform.
    - `SessionCookie` — the browser session the dashboard uses after
      `POST /api/v1/auth/login`. Cookie-authenticated state-changing requests
      additionally require a CSRF token in `X-Cairn-CSRF-Token`.

    Operations tagged `Public` require no authentication: the status page read
    path, subscriber confirmation, and push-monitor ingest.

    ## Pagination

    Every list endpoint paginates by opaque cursor, keyed on `(updated_at, id)`,
    per ADR-004 — uniformly, with no exception for installs small enough that
    sending everything would "work". Offsets are unstable against rows that
    change while a user is paginating, and status changes constantly.

    Cursor responses carry no total count. A count for the current filter comes
    from `GET /api/v1/monitors/membership`, which a client polling for live-view
    freshness is already calling.

    The client is never sent full state. Every list endpoint caps its page size,
    and the dashboard paginates, filters, and searches server-side.

    ## Live updates

    A client subscribes to exactly the monitor IDs on its screen and receives
    `MonitorStatusDiff` messages for those and nothing else — so push volume is
    bounded by viewport size, never by total monitor count. Filtered-view
    membership is kept fresh by polling the membership endpoint above rather than
    by the server evaluating live predicates per connected client.

    The transport is NATS in scaled mode and an in-process bus in solo mode,
    presenting the same message shapes either way. See docs/api/README.md.

    ## Errors

    Errors are `application/problem+json` per RFC 9457. Field-level validation
    failures add an `errors` array naming the offending JSON pointers.

    ## Compatibility

    `/api/v1` carries a written compatibility promise: additive changes only
    within v1. Fields may be added, never removed or retyped; enum values may be
    added, so clients must tolerate unknown values. Breaking changes go to
    `/api/v2`. See docs/api/README.md for the deprecation policy.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: Uptime Cairn
    url: https://uptimecairn.dev
  x-security-contact: security@uptimecairn.dev

externalDocs:
  description: Project documentation
  url: https://uptimecairn.dev/docs

servers:
  - url: "{scheme}://{host}"
    description: An Uptime Cairn install.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:3000

security:
  - ApiKeyAuth: []
  - SessionCookie: []

tags:
  - name: System
    description: Liveness, readiness, build metadata, and Prometheus metrics.
  - name: Setup
    description: First-run bootstrap. Available only until an admin exists.
  - name: Authentication
    description: Session login, logout, and TOTP two-factor enrolment.
  - name: API Keys
    description: Scoped, expiring, revocable keys for automation.
  - name: Monitors
    description: The checks themselves — creation, configuration, and control.
  - name: Monitor History
    description: Heartbeats, rolled-up history, and uptime summaries.
  - name: Groups
    description: Organisational grouping of monitors.
  - name: Tags
    description: Cross-cutting labels used for filtering, status pages, and reports.
  - name: Notification Channels
    description: Alert destinations and webhook payload templating.
  - name: Maintenance Windows
    description: Scheduled suppression windows attached to monitors, groups, or tags.
  - name: Incidents
    description: Incident records and their public timeline.
  - name: Status Pages
    description: Public status page configuration and subscribers.
  - name: Public
    description: Unauthenticated read and ingest paths.
  - name: Outbound Webhooks
    description: Event subscriptions delivered for every state change.
  - name: Import
    description: Uptime Kuma migration, including multi-instance merge.
  - name: Settings
    description: Instance-wide configuration.
  - name: Users
    description: User accounts and roles.
  - name: Teams
    description: Team membership and role assignment. Ships in Phase 3.
  - name: On-Call
    description: Schedules, rotations, and escalation policies. Ships in Phase 3.
  - name: Reports
    description: Report templates, schedules, and generated runs. Ships in Phase 2.

paths:

  # --------------------------------------------------------------------------
  # System
  # --------------------------------------------------------------------------

  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 while the process is running. Never authenticated, never rate-limited.
      security: []
      x-cairn-phase: 1
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 once migrations have completed, the datastore is reachable, and
        the scheduler has started. Returns 503 otherwise, with the failing checks named.
      security: []
      x-cairn-phase: 1
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /metrics:
    get:
      tags: [System]
      operationId: getPrometheusMetrics
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format. Exposes per-monitor status, response time,
        certificate days-remaining, and the instance's own internal metrics.

        Access is controlled by instance settings: either unauthenticated on a bound
        metrics address, or requiring an API key holding `metrics:read`.
      x-cairn-phase: 1
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Instance metadata
      description: Version, build, deployment mode, and enabled capabilities.
      x-cairn-phase: 1
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/overview:
    get:
      tags: [System]
      operationId: getOverview
      summary: Dashboard summary counts
      description: |
        Aggregate counts for the dashboard header — status tallies, active incidents,
        active maintenance, upcoming expiries. Exists so the dashboard can render a
        summary without fetching every monitor, which is the failure mode this
        project is built to avoid.
      x-cairn-phase: 1
      responses:
        "200":
          description: Summary counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------------------------
  # Setup and authentication
  # --------------------------------------------------------------------------

  /api/v1/setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Whether first-run setup is still required
      security: []
      x-cairn-phase: 1
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required:
                    type: boolean
                    description: True until the first administrator account exists.

  /api/v1/setup:
    post:
      tags: [Setup]
      operationId: completeSetup
      summary: Create the first administrator account
      description: |
        Available only while `setup_required` is true. Returns 409 once an account
        exists, so the window cannot be reopened by a later caller.
      security: []
      x-cairn-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Administrator created and a session established.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Establish a browser session
      description: |
        Rate-limited. When the account has TOTP enabled and no `totp_code` is supplied,
        responds 401 with `type` ending `/totp-required`; the client resubmits with the code.
      security: []
      x-cairn-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated. Sets the session cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Destroy the current session
      x-cairn-phase: 1
      responses:
        "204": { description: Session destroyed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Describe the caller
      description: Identifies the authenticated principal, whether a session or an API key.
      x-cairn-phase: 1
      responses:
        "200":
          description: The current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/totp:
    post:
      tags: [Authentication]
      operationId: enrolTotp
      summary: Begin TOTP enrolment
      description: |
        Returns a secret and provisioning URI. Enrolment is not active until confirmed
        via `POST /api/v1/auth/totp/confirm`.
      x-cairn-phase: 1
      responses:
        "200":
          description: Enrolment material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrolment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Authentication]
      operationId: disableTotp
      summary: Disable TOTP
      description: Requires the current password, and a valid code or recovery code.
      x-cairn-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableRequest" }
      responses:
        "204": { description: TOTP disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/auth/totp/confirm:
    post:
      tags: [Authentication]
      operationId: confirmTotp
      summary: Activate TOTP enrolment
      description: Confirms enrolment with a generated code and issues recovery codes.
      x-cairn-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: TOTP active. Recovery codes are shown once and never again.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # --------------------------------------------------------------------------
  # API keys
  # --------------------------------------------------------------------------

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: The key material itself is never returned after creation — only its prefix.
      x-cairn-phase: 1
      x-cairn-scopes: [api_keys:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: A page of API keys.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        The plaintext key is returned exactly once, in this response, and is not
        recoverable afterwards. A key may not be granted a scope its creator does not hold.
      x-cairn-phase: 1
      x-cairn-scopes: [api_keys:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: Key created. `key` is shown once and never again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/api-keys/{apiKeyId}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    get:
      tags: [API Keys]
      operationId: getApiKey
      summary: Retrieve an API key
      x-cairn-phase: 1
      x-cairn-scopes: [api_keys:read]
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [API Keys]
      operationId: updateApiKey
      summary: Update an API key
      description: Name, scopes, and expiry may change. The key material may not.
      x-cairn-phase: 1
      x-cairn-scopes: [api_keys:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyUpdate" }
      responses:
        "200":
          description: The updated key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Takes effect immediately. In-flight requests using the key are not honoured.
      x-cairn-phase: 1
      x-cairn-scopes: [api_keys:write]
      responses:
        "204": { description: Key revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # Monitors
  # --------------------------------------------------------------------------

  /api/v1/monitors:
    get:
      tags: [Monitors]
      operationId: listMonitors
      summary: List monitors
      description: |
        Server-side paginated, filtered, sorted, and searched. This endpoint must remain
        responsive with 5,000 monitors configured — it is covered by the CI load-test gate.

        Filters combine with AND. Repeated array parameters combine with OR within the
        parameter, so `tag_id=a&tag_id=b` matches monitors carrying either tag.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/Search"
        - name: sort
          in: query
          description: |
            Result ordering. Constrained to the cursor key, because ADR-004 fixes
            cursor pagination on `(updated_at, id)` and a keyset cursor can only
            paginate the ordering it is keyed on.

            Sorting by name, status, or uptime is therefore **not offered** — see the
            note in docs/api/README.md. Sorting a page client-side would order 25 rows
            out of 5,000, which is worse than not offering it.
          schema:
            type: string
            default: -updated_at
            enum: [updated_at, -updated_at]
        - name: status
          in: query
          description: Filter by current status.
          schema:
            type: array
            items: { $ref: "#/components/schemas/MonitorStatus" }
          style: form
          explode: true
        - name: type
          in: query
          description: Filter by monitor type.
          schema:
            type: array
            items: { $ref: "#/components/schemas/MonitorType" }
          style: form
          explode: true
        - name: tag_id
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: group_id
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: include
          in: query
          description: |
            Optionally embed related data. `last_heartbeat` and `uptime` cost extra
            per-row work; the dashboard list view requests them, exports do not.
          schema:
            type: array
            items: { type: string, enum: [last_heartbeat, uptime, tags, group] }
          style: form
          explode: false
      responses:
        "200":
          description: A page of monitors.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Monitor" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Monitors]
      operationId: createMonitor
      summary: Create a monitor
      description: |
        The monitor begins checking immediately unless `enabled` is false. Its first
        heartbeat is recorded on the next scheduler tick, not synchronously with this call.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorWrite" }
      responses:
        "201":
          description: Monitor created.
          headers:
            Location:
              description: URL of the created monitor.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/monitors/{monitorId}:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [Monitors]
      operationId: getMonitor
      summary: Retrieve a monitor
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:read]
      parameters:
        - name: include
          in: query
          schema:
            type: array
            items: { type: string, enum: [last_heartbeat, uptime, tags, group, certificate] }
          style: form
          explode: false
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Monitors]
      operationId: updateMonitor
      summary: Update a monitor
      description: |
        Partial update. Omitted fields are left unchanged; explicit `null` clears a
        nullable field. A monitor's `type` is immutable — changing check semantics
        means creating a new monitor, so that its history stays meaningful.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorUpdate" }
      responses:
        "200":
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Monitors]
      operationId: deleteMonitor
      summary: Delete a monitor
      description: |
        Deletes the monitor and its history. Irreversible. Monitors that are the parent
        of a dependency relationship cannot be deleted until their children are reassigned.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      responses:
        "204": { description: Monitor deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/monitors/{monitorId}/pause:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [Monitors]
      operationId: pauseMonitor
      summary: Pause a monitor
      description: Stops checking and suppresses alerts. History is retained.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      responses:
        "200":
          description: The paused monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{monitorId}/resume:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [Monitors]
      operationId: resumeMonitor
      summary: Resume a paused monitor
      description: Resumes on the next scheduler tick. The monitor re-enters `pending` until it has a result.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      responses:
        "200":
          description: The resumed monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{monitorId}/check:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [Monitors]
      operationId: runMonitorCheck
      summary: Run a check now
      description: |
        Executes one check outside the normal schedule and returns its result. The result
        is recorded as a heartbeat and can trigger state changes and notifications like any other.
        Rate-limited per monitor to protect the target.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      responses:
        "200":
          description: The resulting heartbeat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Heartbeat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/monitors/membership:
    get:
      tags: [Monitors]
      operationId: getMonitorMembership
      summary: Membership signal for a filtered view
      description: |
        The reconciliation half of ADR-004. Live updates only reach the monitor IDs a
        client currently has on screen; a monitor that changes status *off* screen and
        would now match an active filter has no subscription telling the server anyone
        cares. This endpoint closes that gap without the server evaluating live
        predicates for every connected client.

        Accepts the same filter parameters as `listMonitors` and returns a cheap
        version and count for that filter. A client polls it on a short interval —
        5 seconds by default — and re-fetches the affected page boundary only when
        `version` or `count` changes. Staleness for filtered views is therefore bounded
        by the poll interval rather than requiring a manual refresh.

        This is ordinary API surface, not a dashboard-only internal: any client
        maintaining a filtered view can use it.

        Implementations must keep this an index-only read. It is polled once per active
        view per interval, so its cost scales with connected clients rather than monitor
        count — the one dimension the 5,000-monitor gate does not exercise by default.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:read]
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/MonitorStatus" }
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/MonitorType" }
          style: form
          explode: true
        - name: tag_id
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: group_id
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: The current membership signal for this filter.
          headers:
            Cache-Control:
              description: Always `no-store`. A cached membership signal is a stale view.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipSignal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/monitors/bulk:
    post:
      tags: [Monitors]
      operationId: bulkUpdateMonitors
      summary: Apply one operation to many monitors
      description: |
        Enable, disable, delete, retag, or regroup up to 1,000 monitors in one call —
        the operation an agency running a thousand monitors needs and cannot do by hand.

        Partial success is normal: the response reports each identifier's outcome
        separately rather than failing the batch.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorBulkRequest" }
      responses:
        "200":
          description: Per-monitor outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # --------------------------------------------------------------------------
  # Monitor history
  # --------------------------------------------------------------------------

  /api/v1/monitors/{monitorId}/heartbeats:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [Monitor History]
      operationId: listHeartbeats
      summary: List raw heartbeats
      description: |
        Individual check results, newest first, within a time range. Raw heartbeats are
        retained per the configured retention policy; older ranges are served from
        rollups via `/history` instead. A range that falls wholly outside raw retention
        returns 200 with an empty page and a `Warning` header, not an error.
      x-cairn-phase: 1
      x-cairn-scopes: [heartbeats:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: important_only
          in: query
          description: Return only state-change heartbeats — the events, not every tick.
          schema: { type: boolean, default: false }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/HeartbeatStatus" }
          style: form
          explode: true
      responses:
        "200":
          description: A page of heartbeats.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Heartbeat" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{monitorId}/history:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [Monitor History]
      operationId: getMonitorHistory
      summary: Rolled-up history
      description: |
        Bucketed history over an arbitrary past range, served from the tiered rollups
        described in ADR-002 (raw, 1m, 5m, 1h, 1d). This is what makes drilldown into
        old ranges cheap, and what the default UI uses instead of a week-long window.

        With `resolution=auto` the server picks the coarsest tier that yields a
        reasonable number of buckets for the requested range and echoes its choice in
        the response.
      x-cairn-phase: 1
      x-cairn-scopes: [heartbeats:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: resolution
          in: query
          schema:
            allOf:
              - $ref: "#/components/schemas/HistoryResolution"
            default: auto
      responses:
        "200":
          description: Bucketed history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{monitorId}/uptime:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [Monitor History]
      operationId: getMonitorUptime
      summary: Uptime summary
      description: |
        Uptime ratio and response-time statistics over one or more named windows, with
        maintenance time excluded or included per `maintenance` — the distinction that
        decides whether an SLA figure is defensible.
      x-cairn-phase: 1
      x-cairn-scopes: [heartbeats:read]
      parameters:
        - name: window
          in: query
          description: Named windows to summarise. Repeat for several.
          schema:
            type: array
            items: { type: string, enum: ["1h", "24h", "7d", "30d", "90d", "365d"] }
            default: ["24h", "30d"]
          style: form
          explode: true
        - name: maintenance
          in: query
          description: How scheduled maintenance is treated in the ratio.
          schema:
            type: string
            enum: [exclude, count_as_up, count_as_down]
            default: exclude
      responses:
        "200":
          description: Uptime summary per window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UptimeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/monitors/{monitorId}/certificate:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [Monitor History]
      operationId: getMonitorCertificate
      summary: TLS certificate detail
      description: |
        The certificate observed on the most recent check, for monitors whose type
        performs a TLS handshake. Returns 404 for monitor types that never see one.
      x-cairn-phase: 1
      x-cairn-scopes: [monitors:read]
      responses:
        "200":
          description: Certificate detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/push/{pushToken}:
    parameters:
      - name: pushToken
        in: path
        required: true
        description: The opaque token issued to a `push` monitor.
        schema: { type: string }
    get:
      tags: [Public]
      operationId: pushHeartbeatGet
      summary: Record a push heartbeat
      description: |
        The dead-man's-switch ingest. A `push` monitor goes down when this endpoint is
        not called within its expected interval plus grace period.

        GET is offered alongside POST because the callers are cron jobs and shell
        scripts, and `curl` with no flags must work. Unauthenticated by design — the
        token is the credential, so it should be treated as a secret.
      security: []
      x-cairn-phase: 1
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [up, down], default: up }
        - name: msg
          in: query
          description: Free-text message recorded on the heartbeat.
          schema: { type: string, maxLength: 1024 }
        - name: ping
          in: query
          description: Client-measured duration in milliseconds, recorded as the response time.
          schema: { type: number, minimum: 0 }
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Public]
      operationId: pushHeartbeatPost
      summary: Record a push heartbeat with a body
      security: []
      x-cairn-phase: 1
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushHeartbeat" }
      responses:
        "200":
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --------------------------------------------------------------------------
