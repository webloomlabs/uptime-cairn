      tags: [Users]
      operationId: createUser
      summary: Create a user
      x-cairn-phase: 3
      x-cairn-scopes: [users:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserWrite" }
