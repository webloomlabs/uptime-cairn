    get:
      tags: [Reports]
      operationId: getReportSchedule
      summary: Retrieve a report schedule
      x-cairn-phase: 2
      x-cairn-scopes: [reports:read]
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
