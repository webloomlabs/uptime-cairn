name: Security

# Dependency and container scanning, plus the two static checks that catch the
# kinds of bug a monitoring tool cannot afford.
#
# On a schedule as well as on pull requests, and the schedule is the half that
# matters: a vulnerability disclosed against a dependency we already ship does
# not arrive with a pull request attached. Without the weekly run, the first
# anybody hears of it is the next time somebody happens to change something.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday morning UTC. Early enough in the week that somebody is around to
    # act on it, rather than a Friday finding that sits until Monday anyway.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # govulncheck rather than a generic dependency scanner, and the difference
      # is the reason it is worth running at all: it reports a vulnerability only
      # when the vulnerable *symbol* is reachable from this code. A scanner that
      # flags every advisory against every module in the graph produces a list
      # nobody reads by the third week, and a list nobody reads is worse than no
      # list — it is a list that will be ignored on the day it matters.
      - name: Scan the module graph
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The harness is a separate module with its own go.sum, and it runs the
      # gate that decides whether a release ships.
      - name: Scan the harness
        working-directory: harness
        run: govulncheck ./...

  npm:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # High and critical only, and it is a deliberate line rather than laziness.
      # Every one of these 69 packages is build tooling — nothing but Svelte
      # itself reaches the browser — so a moderate advisory in a transitive
      # dependency of a bundler is not a vulnerability in the shipped artefact.
      # Failing on it would train everyone to pass --force.
      - name: Audit
        working-directory: web
        run: npm audit --audit-level=high

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: docker/setup-buildx-action@v3

      # Built for this runner's architecture only. The multi-arch build belongs
      # to the release workflow; what is being scanned here is the layer
      # contents, which are the same on both.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: uptime-cairn:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uptime-cairn:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # The scan reports; the SARIF upload below is what surfaces it. A
          # failing scan on a base image with an unfixed advisory would block
          # every pull request for something nobody in this repository can act
          # on, which is how a gate gets disabled.
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: container

      # Separately, and this one *does* fail: an advisory with a fix available
      # against a package we chose to install is a package we can update.
      - name: Fail on fixable findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uptime-cairn:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Generated on every push, not only on a release, because an SBOM that is
      # only produced at release time is one nobody has ever looked at when the
      # release is being cut.
      - name: Generate
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
