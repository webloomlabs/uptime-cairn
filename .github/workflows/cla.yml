name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # This job holds a write token on pull_request_target: never check out or run pull request code here.
      # The upstream repository is archived, so the action is pinned by commit SHA and cannot change.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/webloomlabs/uptime-cairn/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: "dependabot[bot],github-actions[bot]"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in $owner/$repo"
          custom-notsigned-prcomment: >-
            Thank you for contributing to Uptime Cairn. Before we can merge this, we ask that $you sign our
            [Individual Contributor License Agreement](https://github.com/webloomlabs/uptime-cairn/blob/main/CLA.md).
            You keep full copyright in your work, and the agreement cannot be used to paywall a feature in the open build
            ([GOVERNANCE.md §6](https://github.com/webloomlabs/uptime-cairn/blob/main/GOVERNANCE.md)).
            If your employer owns your work, ask them to sign the
            [Corporate CLA](https://github.com/webloomlabs/uptime-cairn/blob/main/CCLA.md) instead.
            To sign as an individual, post this exact comment:
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
