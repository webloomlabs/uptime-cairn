# Tagged release → binaries, checksums, SBOM, multi-arch images.
#
# Nothing here runs on a branch push: the trigger is a semver tag, and the tag
# is what stamps the artefacts. A build with none of the ldflags set reports
# "dev" (internal/version), which is what a developer's own build should say and
# what a release must never say.
#
# BUILD_DATE comes from the commit rather than the clock. Reproducible builds
# are a Phase 0 §3.6 deliverable and a wall-clock timestamp defeats them on its
# own — re-running this workflow on the same tag must produce the same bytes.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Two registries, deliberately. GHCR needs no secret and is what every
  # `docker-compose.yml` and install recipe in this repository points at; Docker
  # Hub is where `docker run webloomlabs/uptime-cairn` resolves, which is the
  # command in README.md and the one people actually type. Publishing to one and
  # documenting the other is how a quick start stops working.
  #
  # The two names coincide today — `webloomlabs` is both the GitHub owner and the
  # Docker Hub account — but they are written out separately rather than derived
  # from `github.repository`, because they are accounts on unrelated services
  # that happen to agree. Deriving one from the other would silently retarget the
  # push if this repository were ever transferred.
  #
  # The Docker Hub name is a repository variable so a fork can point it somewhere
  # it can actually push, falling back to the name the README promises.
  IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'webloomlabs/uptime-cairn' }}

jobs:
  # The frontend is built once and shared. Building it inside each binary job
  # would embed a separately-compiled dashboard in each artefact, and "the
  # amd64 build has a different UI than the arm64 build" is not a bug anybody
  # would find quickly.
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/ui/dist
          retention-days: 1

  binaries:
    name: Binaries
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          # 32-bit Pi. "Runs on a Raspberry Pi" is a claim in README.md, and a
          # Pi that predates the 64-bit images is the one that needs a binary.
          - {goos: linux,   goarch: arm,   goarm: "7"}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/ui/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          build_date="$(git log -1 --format=%cI "${GITHUB_SHA}")"
          pkg=github.com/webloomlabs/uptime-cairn/internal/version
          go build -trimpath \
            -ldflags="-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.BuildDate=${build_date}" \
            -o cairn ./cmd/cairn

          name="cairn_${version}_${GOOS}_${GOARCH}${GOARM:+v$GOARM}"
          mkdir -p "dist/${name}"
          mv cairn "dist/${name}/"
          cp README.md LICENSE NOTICE SECURITY.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*.tar.gz
          retention-days: 1

  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # No QEMU. The Dockerfile pins its build stages to BUILDPLATFORM and
      # cross-compiles — modernc.org/sqlite needs no cgo, so GOARCH is a flag
      # rather than a toolchain, and emulating arm64 to produce identical bytes
      # would cost roughly an order of magnitude in wall-clock.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails the release rather than skipping quietly when the credentials are
      # missing. A tag that publishes to one of its two registries and reports
      # success is the version of this that gets discovered by a user running the
      # command in the README a week later.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  clients:
    name: Generated clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Generated at release time and attached, never committed. Committing them
      # would put thousands of lines of machine output in every spec diff, and a
      # reviewer skimming past generated code is a reviewer skimming past the
      # spec change that produced it.
      #
      # Pinned, and `typescript` supplied explicitly, for the reason spelled out
      # in ci.yml: openapi-ts declares it as a *peer* dependency and npx does not
      # install peers, so `@latest` fails on import with an undefined
      # `ts.SyntaxKind`. It broke CI once. Here it would be worse — the publish
      # job needs this one, so a tag would produce no release at all.
      - name: TypeScript
        run: |
          npx --yes -p typescript@5.9.3 -p @hey-api/openapi-ts@0.99.0 openapi-ts \
            --input docs/api/openapi.yaml \
            --output clients/typescript \
            --client @hey-api/client-fetch

      - name: Go
        run: |
          npx --yes @openapitools/openapi-generator-cli@2.40.1 generate \
            -i docs/api/openapi.yaml \
            -g go \
            -o clients/go \
            --additional-properties=packageName=cairn,isGoSubmodule=true

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/cairn-client-typescript_${GITHUB_REF_NAME}.tar.gz" -C clients typescript
          tar -czf "dist/cairn-client-go_${GITHUB_REF_NAME}.tar.gz" -C clients go

      - uses: actions/upload-artifact@v4
        with:
          name: clients
          path: dist/*.tar.gz
          retention-days: 1

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SPDX over CycloneDX only because it is what most downstream consumers
      # ingest without conversion; the source of truth either way is go.sum and
      # web/package-lock.json.
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: cairn-${{ github.ref_name }}.spdx.json
          output-file: cairn-${{ github.ref_name }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: cairn-${{ github.ref_name }}.spdx.json
          retention-days: 1

  release:
    name: Publish
    needs: [binaries, image, sbom, clients]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: "{binary-*,sbom,clients}"

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f \( -name '*.tar.gz' -o -name '*.spdx.json' \) -exec mv {} dist/ \;
          cd dist
          # One file, sorted, so the same tag produces the same checksum list.
          sha256sum $(ls | sort) > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A tag carrying a prerelease suffix is not "latest" and must not be
          # what an unpinned installer picks up.
          prerelease: ${{ contains(github.ref_name, '-') }}
