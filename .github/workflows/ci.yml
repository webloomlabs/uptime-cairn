name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint spec
        run: npx --yes @redocly/cli@2 lint docs/api/openapi.yaml --format github-actions

      # docs/api/reference.md is generated from the spec so it cannot come to
      # disagree with it. Checked rather than regenerated: a workflow that
      # commits for you means the diff a reviewer reads is not the diff the
      # author wrote.
      - name: API reference is current
        run: |
          go run ./tools/apidoc
          if ! git diff --quiet -- docs/api/reference.md; then
            echo "::error file=docs/api/reference.md::The API reference is out of date. Run 'go run ./tools/apidoc' and commit the result."
            git --no-pager diff -- docs/api/reference.md
            exit 1
          fi

  clients:
    name: Generated clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # Generated on every pull request and never committed.
      #
      # Committing them would put thousands of lines of machine output in every
      # spec diff, and a reviewer skimming past generated code is a reviewer
      # skimming past the spec change that produced it. What CI has to prove is
      # that the spec *can* be generated from — a `$ref` to a schema that does
      # not exist, or a discriminator with no mapping, lints clean and produces
      # a client that will not compile — and that proof is the generation
      # itself.
      #
      # The artefacts are attached to the release, where somebody wanting a
      # client can take one.
      - name: Generate the TypeScript client
        run: |
          npx --yes @hey-api/openapi-ts@latest \
            --input docs/api/openapi.yaml \
            --output /tmp/clients/typescript \
            --client @hey-api/client-fetch

      - name: Generate the Go client
        run: |
          npx --yes @openapitools/openapi-generator-cli@latest generate \
            -i docs/api/openapi.yaml \
            -g go \
            -o /tmp/clients/go \
            --additional-properties=packageName=cairn,isGoSubmodule=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: generated-clients
          path: /tmp/clients
          if-no-files-found: error

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6

  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race, not a plain test run. The probe is a scheduler, a worker pool, and
      # two long-lived streams sharing state; a race there surfaces as a heartbeat
      # that quietly went missing, which is the one failure this product cannot
      # have.
      # -race, and -short. The golden path and crash recovery run a real engine
      # on real twenty-second intervals, which is a minute of wall clock each
      # and belongs in its own job rather than in the loop everyone waits on.
      - name: Test
        run: go test -race -short ./...

      # The seam ADR-001 exists to protect, asserted mechanically rather than by
      # convention: the control plane must not link the checkers. It is also a
      # unit test, and it is here as well because a `go list` assertion inside a
      # test can be skipped when the tool is missing and this cannot.
      - name: Architecture boundaries
        run: |
          deps="$(go list -deps ./internal/controlplane)"
          for forbidden in \
            github.com/webloomlabs/uptime-cairn/internal/probe \
            github.com/webloomlabs/uptime-cairn/internal/observation
          do
            if echo "$deps" | grep -qx "$forbidden"; then
              echo "::error::internal/controlplane links $forbidden, which ADR-001 puts on the probe's side of the seam"
              exit 1
            fi
          done

  e2e:
    name: Golden path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # install → create a monitor → down → alert delivered → recovery →
      # the status page reflects it, through the whole binary rather than
      # through a package.
      #
      # What it catches that no unit test can is wiring. Every component in that
      # chain has tests; none of them proves the composition root joined the
      # dispatcher to the control plane, and a product whose parts all work and
      # are not joined up is a product silently doing nothing.
      #
      # Not -race: it runs the engine at real intervals and the race detector's
      # slowdown pushes a twenty-second interval into flaking on a shared
      # runner. The race build runs over every package in the job above.
      - name: Run
        run: go test -run 'TestGoldenPath|TestCrashRecovery' -timeout 10m ./internal/app/

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Types
        working-directory: web
        run: npm run check

      - name: Format
        working-directory: web
        run: npx prettier --check .

      # The build is the check that matters most here, and not for the reasons a
      # build usually is. //go:embed reads internal/ui/dist at compile time, so a
      # frontend that does not build is a Go binary that ships the previous
      # bundle — or the committed placeholder — and starts perfectly.
      - name: Build
        working-directory: web
        run: npm run build
